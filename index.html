const KIND=Object.fromEntries(KINDS.map(k=>[k.key,k]));
// Current-carrying capacity (A), 70°C PVC copper, 30°C ambient, single-phase. BS 7671 Appendix 4 tables 4D1A (singles) and 4D5 (twin & earth).
const METHODS={
  B1:{label:'Singles in conduit, in/on wall (Method B)',short:'B singles',iz:{1:13.5,1.5:17.5,2.5:24,4:32,6:41,10:57,16:76,25:101}},
  B2:{label:'Twin & earth in conduit/trunking (Method B)',short:'B T&E',iz:{1:13,1.5:16.5,2.5:23,4:30,6:38,10:52,16:69}},
  C:{label:'Twin & earth clipped direct (Method C)',short:'C T&E',iz:{1:16,1.5:20,2.5:27,4:37,6:47,10:64,16:85}},
  A:{label:'In conduit in a thermally insulated wall (Method A)',short:'A',iz:{1:11,1.5:14.5,2.5:19.5,4:26,6:34,10:46,16:61,25:80}}
};
const MVAM={1:44,1.5:29,2.5:18,4:11,6:7.3,10:4.4,16:2.8,25:1.75}; // mV/A/m, single-phase
const SIZES=[1,1.5,2.5,4,6,10,16,25];
const RATINGS=[6,10,13,16,20,25,32,40,45,50,63];
const boardList=()=>Object.entries(S.boards).map(([id,b])=>({id,...b})).sort((a,b)=>(a.role==='main'?0:1)-(b.role==='main'?0:1)||String(a.name).localeCompare(String(b.name)));
const circuitList=()=>Object.entries(S.circuits).map(([id,c])=>({id,...c})).sort((a,b)=>(+a.way||99)-(+b.way||99));
const cref=c=>{ const b=S.boards[c.boardId]; return (b?b.name:'?')+'/'+(c.way||'?'); };
const isBathRoom=r=>r&&/bath|shower|en-?suite/i.test(r.name)&&!r.outdoor;
const elecPts=()=>pointList().filter(p=>PT[p.type]&&['electrical','lighting'].includes(PT[p.type].sector));
function circuitVd(c,depth=0){
  const mv=MVAM[c.cable], L=+c.length; if(!mv||!L||!c.rating) return null;
  let vd=mv*c.rating*L/1000; if(c.kind==='ring') vd/=4;
  const b=S.boards[c.boardId]; if(b&&b.role==='sub'&&depth<3){ const feed=circuitList().find(x=>x.kind==='submain'&&x.feeds===c.boardId); if(feed){ const up=circuitVd(feed,depth+1); if(up!=null) vd+=up; } }
  return vd;
}
function circuitArea(c){ const ids=new Set(elecPts().filter(p=>p.circuitId===c.id).map(p=>p.roomId)); let a=0; ids.forEach(id=>{const r=S.rooms[id]; if(r) a+=r.w*r.d;}); return a; }
function elecChecks(){
  const out=[]; const add=(level,src,ref,text,bid,cid)=>out.push({level,src,ref,text,bid:bid||'',cid:cid||''});
  const boards=boardList(), circs=circuitList(), pts=elecPts();
  if(!boards.length) add('info','','', 'Add your distribution boards to start the checks.');
  for(const b of boards){
    const cs=circs.filter(c=>c.boardId===b.id);
    if(b.role==='main'){
      if(b.poles==='SP') add('error','MT','Malta EIR · BS 7671 462.1.201',`${b.name}: the main switch is single-pole. Malta's regulations require a double-pole main circuit breaker, and BS 7671 asks for a double-pole main switch in a dwelling.`,b.id);
      else if(!b.poles) add('info','MT','Malta EIR',`${b.name}: record the main switch. It must be double-pole.`,b.id);
      if(b.ovuv==='no') add('error','MT','Malta EIR',`${b.name}: no over/under-voltage protection device. Malta's regulations require one at the origin, with the 30 mA RCDs fitted after it.`,b.id);
      else if(!b.ovuv) add('info','MT','Malta EIR',`${b.name}: record whether the over/under-voltage device is fitted. It is required in Malta.`,b.id);
      const ra=+b.ra;
      if(b.ra!==''&&b.ra!=null&&!isNaN(ra)){ if(ra*0.03>50) add('error','UK','BS 7671 411.5.3',`${b.name}: earth electrode resistance ${ra} Ω is too high even for a 30 mA RCD (RA × IΔn must not exceed 50 V, so RA ≤ 1,667 Ω).`,b.id); else if(ra>200) add('warn','UK','BS 7671 Table 41.5 note',`${b.name}: earth electrode resistance ${ra} Ω. Values above 200 Ω may not be stable through dry summers; add or deepen electrodes.`,b.id); }
      else add('info','MT','Malta EIR reg 22 · BS 7671 542',`${b.name}: TT earthing. Use one or more earth electrodes with a copper earthing conductor of at least 16 mm². Metal water pipes are not acceptable as the earth. Record the measured electrode resistance (RA) here.`,b.id);
    }
    if(b.role==='sub'&&!circs.some(c=>c.kind==='submain'&&c.feeds===b.id)) add('warn','','',`${b.name}: no sub-main circuit feeds this board yet. Add a "Sub-main to another board" circuit on the board that supplies it.`,b.id);
    if(b.spd==='no') add('warn','UK','BS 7671 443.4 · 534',`${b.name}: no surge protective device (SPD). One is expected unless a risk assessment shows it is not needed; fit it at or near the origin.`,b.id);
    else if(!b.spd&&b.role==='main') add('info','UK','BS 7671 443.4',`${b.name}: record whether a surge protective device (SPD) is fitted.`,b.id);
    if(b.enclosure==='plastic') add('warn','UK','BS 7671 421.1.201',`${b.name}: a consumer unit in a dwelling should have a non-combustible (e.g. steel) enclosure.`,b.id);
    const used=cs.length; if(+b.ways&&used>+b.ways) add('error','','',`${b.name}: ${used} circuits but only ${b.ways} ways. Use a bigger board.`,b.id); else if(+b.ways&&+b.ways-used<2) add('info','','',`${b.name}: ${+b.ways-used} spare way${+b.ways-used===1?'':'s'} left. Leave room for future circuits.`,b.id);
  }
  for(const c of circs){
    const ref=`${cref(c)} ${c.name||KIND[c.kind]?.label||''}`; const cp=pts.filter(p=>p.circuitId===c.id);
    const rcd=c.device==='RCBO'||c.device==='RCD+MCB';
    if(c.kind!=='submain'){
      if(!rcd) add('error','MT','Malta EIR reg 20(5) · BS 7671 411.3.3 / 411.3.4 / 522.6.202',`${ref}: no 30 mA RCD. Malta requires 30 mA RCD protection on each sub-circuit; BS 7671 requires it for sockets up to 32 A, for lighting in dwellings and for cables concealed less than 50 mm deep in walls.`,c.boardId,c.id);
      else if(+c.rcdMa>30) add('error','MT','Malta EIR reg 20(5) · BS 7671 411.3.3',`${ref}: RCD is ${c.rcdMa} mA. It must be 30 mA (Malta allows up to 300 mA only for a specific high-leakage load).`,c.boardId,c.id);
      if(rcd&&c.device==='RCD+MCB') add('warn','MT','Malta EIR reg 20(5) · BS 7671 314.1',`${ref}: shares an RCD with other circuits. Malta's regulations call for RCDs protecting sub-circuits separately; an RCBO per circuit meets this and stops one fault from tripping several circuits.`,c.boardId,c.id);
      if(rcd&&c.rcdType==='AC') add('warn','UK','BS 7671 531.3.3',`${ref}: Type AC RCD. Use Type A or better: Type AC only suits fixed equipment known to produce no DC components.`,c.boardId,c.id);
      if(rcd&&c.kind==='ac'&&c.rcdType==='A') add('info','UK','BS 7671 531.3.3',`${ref}: inverter A/C units can need a Type F RCD. Check the manufacturer's instructions.`,c.boardId,c.id);
    }
    const m=METHODS[c.method]; const iz=m&&m.iz[c.cable];
    if(c.rating&&c.cable){ if(iz==null) add('info','UK','BS 7671 Appendix 4',`${ref}: no rating table entry for ${c.cable} mm² with this installation method; check the cable rating by hand.`,c.boardId,c.id);
      else if(c.kind==='ring'){ if(iz<0.67*(+c.rating)) add('error','UK','BS 7671 433.1.204',`${ref}: a ${c.rating} A ring needs each leg rated at least ${(0.67*c.rating).toFixed(0)} A; ${c.cable} mm² here is about ${iz} A (${m.short}).`,c.boardId,c.id); }
      else if(+c.rating>iz) add('error','UK','BS 7671 433.1.1',`${ref}: ${c.rating} A device on ${c.cable} mm² cable rated about ${iz} A (${m.short}). The device must not exceed the cable's rating.`,c.boardId,c.id);
      else if(c.kind!=='ring'&&+c.rating>iz*0.94) add('warn','UK','BS 7671 Appendix 4 Table 4B1',`${ref}: ${c.rating} A is within 6% of the cable's ${iz} A rating. At a 35 °C ambient (common in Maltese summers, roof spaces, sunny walls) the rating drops by about 6%; grouping with other circuits reduces it further.`,c.boardId,c.id); }
    if(c.kind==='ring'){ if(c.rating&&![30,32].includes(+c.rating)) add('warn','UK','BS 7671 Appendix 15',`${ref}: a ring final is normally protected at 30 or 32 A.`,c.boardId,c.id); if(c.cable&&+c.cable<2.5) add('error','UK','BS 7671 Appendix 15',`${ref}: a ring final needs at least 2.5 mm² live conductors.`,c.boardId,c.id); const a=circuitArea(c); if(a>100) add('warn','UK','BS 7671 Appendix 15',`${ref}: serves about ${a.toFixed(0)} m², over the 100 m² guide for one ring. Split it.`,c.boardId,c.id); }
    if(c.kind==='radial'){ if(+c.rating>20&&+c.cable<4) add('error','UK','BS 7671 Appendix 15',`${ref}: a ${c.rating} A socket radial needs 4 mm² cable.`,c.boardId,c.id); const a=circuitArea(c), lim=+c.rating>20?75:50; if(a>lim) add('warn','UK','BS 7671 Appendix 15',`${ref}: serves about ${a.toFixed(0)} m², over the ${lim} m² guide for a ${+c.rating>20?'32':'20'} A radial.`,c.boardId,c.id); }
    if(c.kind==='lighting'){ if(+c.rating>16) add('error','UK','BS 7671 Table 55.1',`${ref}: lighting circuits with B22 or E27 lampholders must be protected at 16 A or less.`,c.boardId,c.id); else if(+c.rating>10) add('info','','',`${ref}: lighting is usually 6 or 10 A.`,c.boardId,c.id); const n=cp.filter(p=>p.type==='light').length; if(n>15) add('info','','',`${ref}: ${n} light points. Consider splitting so one fault doesn't leave a whole floor dark.`,c.boardId,c.id); }
    if(c.kA&&+c.kA<6) add('warn','UK','BS 7671 434.5.1 · 536.1',`${ref}: ${c.kA} kA breaking capacity. Check it against the prospective fault current at the board; 6 kA is the usual domestic minimum.`,c.boardId,c.id);
    if(c.curve==='D') add('warn','','',`${ref}: Type D breakers are rarely right in a home and need a very low earth fault loop impedance. Use B (or C for motor loads).`,c.boardId,c.id);
    const vd=circuitVd(c); if(vd!=null){ const lim=c.kind==='lighting'?6.9:11.5; const pct=vd/230*100; if(vd>lim) add('warn','UK','BS 7671 525 · Appendix 4 Table 4Ab',`${ref}: estimated voltage drop ${pct.toFixed(1)}% (${vd.toFixed(1)} V) at full breaker rating, over the ${c.kind==='lighting'?3:5}% limit. Use a larger cable or shorter run; this estimate is conservative.`,c.boardId,c.id); }
    else if(c.kind!=='submain') add('info','','',`${ref}: add the cable length to check voltage drop.`,c.boardId,c.id);
    if(!cp.length&&['ring','radial','lighting'].includes(c.kind)) add('info','','',`${ref}: no points assigned yet.`,c.boardId,c.id);
    if(['ring','radial'].includes(c.kind)&&!c.afdd) add('info','UK','BS 7671 421.1.7 (A2:2022)',`${ref}: arc fault detection (AFDD) is recommended for socket circuits in the UK's current text. It is not in the 2018 text Malta refers to.`,c.boardId,c.id);
  }
  for(const p of pts){ const r=S.rooms[p.roomId]; if(p.type==='socket'&&isBathRoom(r)) add('error','UK','BS 7671 701.512.3',`Socket in ${r.name}: sockets in a room with a bath or shower must be at least 2.5 m from the zone 1 boundary. Shaver supply units are allowed closer.`,'',p.circuitId||''); }
  const un=pts.filter(p=>!p.circuitId||!S.circuits[p.circuitId]); if(un.length) add('info','','',`${un.length} electrical or lighting point${un.length===1?' is':'s are'} not assigned to a circuit yet.`);
  return out;
}
const SEV={error:{label:'Must fix',c:'var(--bad)'},warn:{label:'Check',c:'var(--warn)'},info:{label:'Note',c:'var(--accent)'}};

/* ----- Single-line diagram ----- */
function sldSVG(b){
  const cs=circuitList().filter(c=>c.boardId===b.id); const ways=Math.max(+b.ways||0,cs.length); const colW=78, x0=230, busY=150;
  const W=x0+Math.max(1,ways)*colW+30, H=520; const chk=elecChecks(); const bad=id=>chk.some(k=>k.cid===id&&k.level==='error');
  const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" ${o} font-family="IBM Plex Sans Condensed, sans-serif" fill="var(--ink)">${esc(t)}</text>`;
  const box=(x,y,w,h,lines,stroke='var(--ink)')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="var(--panel)" stroke="${stroke}" stroke-width="1.4"/>`+lines.map((l,i)=>T(x+w/2,y+16+i*14,l,`text-anchor="middle" font-size="${i?10.5:12}" ${i?'':'font-weight="600"'}`)).join('');
  let g='';
  const feed=b.role==='sub'?circuitList().find(c=>c.kind==='submain'&&c.feeds===b.id):null;
  if(b.role==='main'){
    g+=box(20,14,170,36,['Supply',`230 V 1-phase · TT${b.supplyA?' · '+b.supplyA+' A':''}`]);
    g+=`<line x1="105" y1="50" x2="105" y2="62" stroke="var(--ink)" stroke-width="1.6"/>`;
    g+=box(20,62,170,34,['Over/under voltage',b.ovuv==='yes'?'fitted':b.ovuv==='no'?'MISSING':'not recorded'],b.ovuv==='no'?'var(--bad)':'var(--ink)');
    g+=`<line x1="105" y1="96" x2="105" y2="106" stroke="var(--ink)" stroke-width="1.6"/>`;
    g+=box(20,106,170,34,['Main switch',`${b.poles==='SP'?'single-pole':b.poles==='DP'?'double-pole':'poles ?'}${b.mainSwitch?' · '+b.mainSwitch+' A':''}`],b.poles==='SP'?'var(--bad)':'var(--ink)');
  } else {
    g+=box(20,62,170,48,['Fed from',feed?`${cref(feed)} · ${feed.device==='MCB'?'MCB':feed.device} ${feed.curve||''}${feed.rating||''}`:'no sub-main yet',feed?`${feed.cable||'?'} mm² · ${feed.length||'?'} m`:''],feed?'var(--ink)':'var(--warn)');
    g+=box(20,116,170,24,[`Isolator${b.mainSwitch?' '+b.mainSwitch+' A':''}`]);
  }
  g+=`<line x1="190" y1="128" x2="${x0-30}" y2="128" stroke="var(--ink)" stroke-width="1.6"/><line x1="${x0-30}" y1="128" x2="${x0-30}" y2="${busY}" stroke="var(--ink)" stroke-width="1.6"/>`;
  g+=`<line x1="${x0-40}" y1="${busY}" x2="${W-20}" y2="${busY}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>`;
  g+=T(W-20,busY-10,`${b.name} busbar`,'text-anchor="end" font-size="11" font-weight="600" fill="var(--muted)"');
  // SPD + MET
  g+=`<line x1="${x0-30}" y1="${busY}" x2="${x0-30}" y2="${busY+40}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="${b.spd==='yes'?'0':'4 3'}"/>`;
  g+=box(x0-80,busY+40,100,34,['SPD',b.spd==='yes'?'Type 2 fitted':b.spd==='no'?'not fitted':'not recorded'],b.spd==='no'?'var(--warn)':'var(--ink)');
  if(b.role==='main'){ g+=box(20,busY+120,170,48,['Main earthing terminal','earth electrode(s), 16 mm² Cu',`RA = ${b.ra!==''&&b.ra!=null?b.ra+' Ω':'not measured'}`]);
    const ex=105, ey=busY+168; g+=`<line x1="${ex}" y1="${ey}" x2="${ex}" y2="${ey+16}" stroke="var(--ink)" stroke-width="1.4"/>`+[0,1,2].map(i=>`<line x1="${ex-14+i*5}" y1="${ey+16+i*5}" x2="${ex+14-i*5}" y2="${ey+16+i*5}" stroke="var(--ink)" stroke-width="1.4"/>`).join(''); }
  for(let i=0;i<Math.max(1,ways);i++){
    const c=cs[i]; const x=x0+i*colW+colW/2;
    if(!c){ g+=`<line x1="${x}" y1="${busY}" x2="${x}" y2="${busY+40}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 3"/>`+T(x,busY+56,'spare','text-anchor="middle" font-size="10.5" fill="var(--muted)"'); continue; }
    const col=SEC[c.kind==='lighting'?'lighting':'electrical'].color; const stroke=bad(c.id)?'var(--bad)':'var(--ink)';
    g+=`<g data-circ="${c.id}" style="cursor:pointer"><line x1="${x}" y1="${busY}" x2="${x}" y2="${busY+28}" stroke="var(--ink)" stroke-width="1.4"/>`;
    g+=`<rect x="${x-30}" y="${busY+28}" width="60" height="50" rx="5" fill="var(--panel)" stroke="${stroke}" stroke-width="${bad(c.id)?2.2:1.4}"/>`;
    g+=T(x,busY+43,c.device||'?','text-anchor="middle" font-size="10" fill="var(--muted)"')+T(x,busY+58,`${c.curve||''}${c.rating||'?'}`,'text-anchor="middle" font-size="14" font-weight="700"')+T(x,busY+72,c.device==='MCB'?(c.kA?c.kA+' kA':''):`${c.rcdMa||30}mA ${c.rcdType||''}`,'text-anchor="middle" font-size="9.5" fill="var(--muted)"');
    g+=`<line x1="${x}" y1="${busY+78}" x2="${x}" y2="${busY+100}" stroke="${col}" stroke-width="2.4"/>`;
    g+=`<circle cx="${x}" cy="${busY+110}" r="11" fill="${col}"/>`+T(x,busY+114,String(c.way||i+1),'text-anchor="middle" font-size="11" font-weight="700" fill="#fff"');
    const n=elecPts().filter(p=>p.circuitId===c.id).length; const vd=circuitVd(c);
    g+=`<text transform="translate(${x-4} ${busY+130}) rotate(90)" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" font-weight="600" fill="var(--ink)">${esc((c.name||KIND[c.kind]?.label||'').slice(0,34))}</text>`;
    g+=`<text transform="translate(${x+10} ${busY+130}) rotate(90)" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--muted)">${esc(`${c.cable||'?'}/${c.cpc||'?'} mm² · ${c.length||'?'} m${c.kind==='submain'?' → '+(S.boards[c.feeds]?.name||'?'):` · ${n} pts`}${vd!=null?` · ${(vd/2.3).toFixed(1)}%`:''}`)}</text></g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(b.name)} single-line diagram" style="max-width:none">${g}</svg>`;
}

  ov.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  ov.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); const g=s=>ov.querySelector(s).value;
    const n={...c,boardId:g('#ccBoard'),way:Number(g('#ccWay'))||way,kind:g('#ccKind'),name:g('#ccName').trim(),feeds:g('#ccKind')==='submain'?g('#ccFeeds'):'',device:g('#ccDev'),curve:g('#ccCurve'),rating:Number(g('#ccRating')),kA:Number(g('#ccKa')),rcdMa:Number(g('#ccMa')),rcdType:g('#ccRt'),afdd:ov.querySelector('#ccAfdd').checked,cable:Number(g('#ccCable')),cpc:Number(g('#ccCpc')),method:g('#ccMethod'),length:g('#ccLen')===''?'':Number(g('#ccLen')),notes:g('#ccNotes')};
    if(!n.name) n.name=KIND[n.kind]?.label||'Circuit';
    const cid=id||uid('c'); ov.querySelectorAll('[data-cpt]').forEach(cb=>{ const p=S.points[cb.dataset.cpt]; if(!p) return; const on=cb.checked; if(on&&p.circuitId!==cid){ savePoint(cb.dataset.cpt,{...clone(p),circuitId:cid}); } else if(!on&&p.circuitId===cid){ savePoint(cb.dataset.cpt,{...clone(p),circuitId:''}); } });
    ov.remove(); store.put('circuits',cid,n); });
}
function addTypicalCircuits(bid){
  const base={boardId:bid,device:'RCBO',curve:'B',kA:6,rcdMa:30,rcdType:'A',afdd:false,method:'B1',length:'',feeds:'',notes:''};
  const list=[['Lighting','lighting',6,1.5,1.5],['Sockets','ring',32,2.5,1.5],['Kitchen sockets','ring',32,2.5,1.5],['Cooker / hob','cooker',32,6,2.5],['Water heater','water',16,2.5,1.5],['A/C','ac',16,2.5,1.5],['Washing machine & dryer','dedicated',16,2.5,1.5]];
  const used=circuitList().filter(c=>c.boardId===bid).map(c=>+c.way); let w=1;
  list.forEach(([name,kind,rating,cable,cpc])=>{ while(used.includes(w)) w++; used.push(w); store.put('circuits',uid('c'),{...base,way:w,name,kind,rating,cable,cpc}); });
  toast('Added 7 typical circuits. Edit them to match your board.');
}
function handleElecClick(t){
  const bd=t.closest('[data-board]'); if(bd){ UI.board=bd.dataset.board; UI.confirmDel=null; renderElectrical(); return true; }
  if(t.closest('#addBoard')){ const n=boardList().length; const id=uid('b'); UI.board=id; store.put('boards',id,{name:'DB'+(n+1),role:n?'sub':'main',roomId:'',ways:12,mainSwitch:'',poles:'',ovuv:'',spd:'',enclosure:'',ra:'',supplyA:''}); return true; }
  if(t.closest('#delBoard')){ const id=UI.board; if(UI.confirmDel===id){ circuitList().filter(c=>c.boardId===id).forEach(c=>{ store.del('circuits',c.id); pointList().filter(p=>p.circuitId===c.id).forEach(p=>{const n=clone(S.points[p.id]); n.circuitId=''; savePoint(p.id,n);}); }); store.del('boards',id); UI.board=null; UI.confirmDel=null; } else { UI.confirmDel=id; renderElectrical(); } return true; }
  if(t.closest('#placeBoard')){ const b=S.boards[UI.board]; const r=S.rooms[b.roomId]; UI.planLevel=r?r.level:0; UI.tool='db:'+UI.board; UI.planLayers.electrical=true; go('plans'); toast(`Click on the plan where ${b.name} goes.`); return true; }
  if(t.closest('#addCirc')){ openCircuit(null); return true; }
  if(t.closest('#tplCirc')){ addTypicalCircuits(UI.board); return true; }
  const cf=t.closest('[data-chkf]'); if(cf){ UI.chkFilter=cf.dataset.chkf; renderElectrical(); return true; }
  const ci=t.closest('[data-circ]'); if(ci&&S.circuits[ci.dataset.circ]){ openCircuit(ci.dataset.circ); return true; }
  return false;
}
function handleElecChange(t){
  const map={bdName:'name',bdRole:'role',bdRoom:'roomId',bdWays:'ways',bdMain:'mainSwitch',bdPoles:'poles',bdOv:'ovuv',bdRa:'ra',bdSupply:'supplyA',bdSpd:'spd',bdEnc:'enclosure'};
  if(map[t.id]&&UI.board){ const b=clone(S.boards[UI.board]); let v=t.value; if(['ways','mainSwitch','ra','supplyA'].includes(map[t.id])) v=v===''?'':Number(v); if(map[t.id]==='name') v=v.trim()||'DB'; b[map[t.id]]=v; store.put('boards',UI.board,b); return true; }
  if(t.dataset.assign){ if(!t.value) return true; const p=clone(S.points[t.dataset.assign]); p.circuitId=t.value; savePoint(t.dataset.assign,p); return true; }
  if(t.id==='ptCirc'){ const p=clone(S.points[UI.planSel]); p.circuitId=t.value; savePoint(UI.planSel,p); return true; }
  return false;
}

/* ---------- Routing ---------- */
const VIEWS=['house','tasks','timeline','plans','electrical','dump','budget','setup'];
function go(v){ UI.view=v; if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); const a=document.activeElement; a&&a.blur&&a.blur(); deferred=false; $('#main').innerHTML=''; render(); }
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)&&h!==UI.view) go(h); });
window.addEventListener('resize',()=>{ if(UI.view==='house'&&UI.dim==='3d'){ UI.zoom=null; build3D(); } });

/* ---------- Boot ---------- */
(async function boot(){
  const h=location.hash.slice(1); if(VIEWS.includes(h)) UI.view=h;
  render();
  await store.init();
  store.watch('rooms',o=>{S.rooms=o; S.loaded.rooms=true; scheduleRender();});
  store.watch('tasks',o=>{S.tasks=o; S.loaded.tasks=true; scheduleRender();});
  store.watch('points',o=>{S.points=o; S.loaded.points=true; scheduleRender();});
  store.watch('items',o=>{S.items=o; scheduleRender();});
  store.watch('boards',o=>{S.boards=o; scheduleRender();});
  store.watch('circuits',o=>{S.circuits=o; scheduleRender();});
  store.watchDoc('meta/house',m=>{ if(m) S.meta={...S.meta,...m}; scheduleRender(); });
  window.HUB={S,store,UI};
})();
</script>
