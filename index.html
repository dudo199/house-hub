  ov.addEventListener('submit',e=>{ e.preventDefault(); pull(); if(!it.name.trim()) return; it.name=it.name.trim(); it.quotes=it.quotes.filter(q=>q.supplier||q.price!==''||q.file); if(!it.quotes.some(q=>q.id===it.chosen)) it.chosen=''; ov.remove(); store.put('items',id||uid('i'),it); });
}

/* ---------- PDF export ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(s); }); }
const pdfSafe=s=>String(s??'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/→/g,'>').replace(/[^\x20-\x7E -ÿ€]/g,'');
function hexRgb(h){ const P=window.PDFLib; if(h==='var(--good)') h='#2c8a4b'; const m=/^#?([0-9a-f]{6})$/i.exec(h)||[0,'333333']; const n=parseInt(m[1],16); return P.rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255); }
const DISC={arch:{title:'Architectural layout',code:'A'},elec:{title:'Electrical & lighting layout',code:'E'},plumb:{title:'Plumbing & gas layout',code:'P'},walls:{title:'Wall works schedule',code:'W'}};
async function exportPDF(){
  const discs=Object.keys(DISC).filter(k=>UI.exp.disc[k]); const lvls=[0,1,2].filter(i=>UI.exp.levels[i]&&roomList().some(r=>r.level===i));
  if(!discs.length||!lvls.length){ toast('Pick at least one drawing and one level that has rooms.'); return; }
  if(!CAP.downloads){ toast('PDF downloads work on the published page.'); return; }
  UI.exp.busy=true; renderPlans();
  try{
    if(!window.PDFLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
    const bytes=await buildPDF(discs,lvls);
    const name=pdfSafe((S.meta.name||'House').replace(/[^\w\- ]+/g,'').trim()||'House')+' drawings '+todayISO()+'.pdf';
    await CAP.downloads.save({filename:name,data:bytes});
    toast('PDF saved.');
  }catch(e){ console.error(e); if(e&&e.code==='declined'){} else toast(e&&e.code==='rate_limited'?'A download prompt is already open.':'Could not build the PDF. Try again.'); }
  UI.exp.busy=false; if(UI.view==='plans') renderPlans();
}
async function buildPDF(discs,lvls){
  const P=window.PDFLib; const pdf=await P.PDFDocument.create(); pdf.setTitle(pdfSafe((S.meta.name||'House')+' drawings')); pdf.setCreator('House Completion Hub');
  const F=await pdf.embedFont(P.StandardFonts.Helvetica), FB=await pdf.embedFont(P.StandardFonts.HelveticaBold);
  const PW=1190.55, PH=841.89, M=24, TB=262; const ink=P.rgb(.11,.13,.15), grey=P.rgb(.45,.48,.5), light=P.rgb(.82,.84,.85);
  const b=houseBounds(); const pad=1.3; const bw=(b.x1-b.x0)+pad*2, bh=(b.y1-b.y0)+pad*2;
  const aw=PW-M*2-TB-14, ah=PH-M*2-20;
  const scales=[20,25,50,75,100,125,150,200,250,500]; let sc=scales.find(s=>bw*2834.65/s<=aw&&bh*2834.65/s<=ah)||500; const k=2834.65/sc;
  const ox=M+(aw-bw*k)/2+pad*k, oyTop=M+10+(ah-bh*k)/2+pad*k;
  const X=x=>ox+(x-b.x0)*k, Y=y=>PH-(oyTop+(y-b.y0)*k);
  const total=discs.length*lvls.length; let sheet=0;
  for(const disc of discs) for(const lv of lvls){
    sheet++; const pg=pdf.addPage([PW,PH]); const rs=roomList().filter(r=>r.level===lv);
    const T=(t,x,y,o={})=>{ const f=o.bold?FB:F, sz=o.size||8; t=pdfSafe(t); let tx=x; const w=f.widthOfTextAtSize(t,sz); if(o.align==='center') tx=x-w/2; if(o.align==='right') tx=x-w; pg.drawText(t,{x:tx,y,size:sz,font:f,color:o.color||ink,rotate:o.rotate?P.degrees(o.rotate):undefined}); return w; };
    const L=(x1,y1,x2,y2,th=.6,c=ink,dash)=>pg.drawLine({start:{x:x1,y:y1},end:{x:x2,y:y2},thickness:th,color:c,dashArray:dash});
    // frame
    pg.drawRectangle({x:M-8,y:M-8,width:PW-2*M+16,height:PH-2*M+16,borderColor:ink,borderWidth:1});
    // footprint
    const fw=+S.meta.width||0, fd=+S.meta.depth||0; if(fw>0&&fd>0){ const pts=[[0,0],[fw,0],[fw,fd],[0,fd],[0,0]]; for(let i=0;i<4;i++) L(X(pts[i][0]),Y(pts[i][1]),X(pts[i+1][0]),Y(pts[i+1][1]),.5,grey,[4,3]); }
    // rooms
    for(const r of rs){ const c=r.outdoor?P.rgb(.92,.95,.9):disc==='arch'?P.rgb(.95,.95,.94):P.rgb(.98,.98,.98); pg.drawRectangle({x:X(r.x),y:Y(r.y+r.d),width:r.w*k,height:r.d*k,color:c}); }
    for(const r of rs) for(const [kk,s] of Object.entries(WALL_SEGS(r))){ const ws=disc==='walls'?wallState((r.walls||{})[kk]):null; const [x1,y1,x2,y2]=insetSeg(kk,s,.06); L(X(x1),Y(y1),X(x2),Y(y2),ws?Math.max(2.4,.12*k):Math.max(1.2,.07*k),ws?hexRgb(ws.color):ink); }
    for(const r of rs) for(const op of (r.openings||[])){ const q=openingGeom(r,op); if(!q) continue;
      L(X(q.p0[0]),Y(q.p0[1]),X(q.p1[0]),Y(q.p1[1]),Math.max(5,.34*k),P.rgb(1,1,1));
      const nx=q.n[0]*.17,ny=q.n[1]*.17; for(const p of [q.p0,q.p1]) L(X(p[0]-nx),Y(p[1]-ny),X(p[0]+nx),Y(p[1]+ny),.8,ink);
      if(op.type==='door'){ L(X(q.hinge[0]),Y(q.hinge[1]),X(q.leaf[0]),Y(q.leaf[1]),1,ink); for(let i=0;i<q.arc.length-1;i++) L(X(q.arc[i][0]),Y(q.arc[i][1]),X(q.arc[i+1][0]),Y(q.arc[i+1][1]),.4,grey); }
      else if(op.type==='window'){ for(const f of [-.07,0,.07]) L(X(q.p0[0]+q.n[0]*f),Y(q.p0[1]+q.n[1]*f),X(q.p1[0]+q.n[0]*f),Y(q.p1[1]+q.n[1]*f),.5,ink); }
      if(disc==='arch'){ const mx=(q.p0[0]+q.p1[0])/2+q.n[0]*.35, my=(q.p0[1]+q.p1[1])/2+q.n[1]*.35; T(`${op.type==='door'?'D':op.type==='window'?'W':'O'} ${(+q.w).toFixed(2)}`,X(mx),Y(my)-2,{size:5.5,align:'center',color:grey}); } }
    // labels
    for(const r of rs){ const cx=X(r.x+r.w/2), cy=disc==='elec'||disc==='plumb'?Y(r.y)-Math.min(20,r.d*k/3):Y(r.y+r.d/2); let sz=Math.min(9,r.w*k/9); const nw=FB.widthOfTextAtSize(pdfSafe(r.name),1); sz=Math.max(4.5,Math.min(sz<5.5?5.5:sz,(r.w*k-6)/nw));
      T(r.name,cx,cy+2,{bold:true,size:sz,align:'center'});
      if(disc==='arch') T(`${(+r.w).toFixed(2)} x ${(+r.d).toFixed(2)} m · ${(r.w*r.d).toFixed(1)} m²`,cx,cy-sz,{size:sz*.72,align:'center',color:grey}); }
    // points
    const secs=disc==='elec'?['electrical','lighting']:disc==='plumb'?['plumbing']:[];
    const pts=pointList().filter(p=>PT[p.type]&&secs.includes(PT[p.type].sector)&&rs.some(r=>r.id===p.roomId));
    for(const p of pts){ const ty=PT[p.type]; const c=hexRgb(SEC[ty.sector].color); const x=X(p.x), y=Y(p.y);
      pg.drawCircle({x,y,size:6.5,color:p.done?c:P.rgb(1,1,1),borderColor:c,borderWidth:1.1}); T(ty.g,x,y-2.1,{bold:true,size:ty.g.length>1?4.6:6,align:'center',color:p.done?P.rgb(1,1,1):c});
      if(p.label) T(p.label,x+9,y-2.5,{size:5.5,color:grey}); }
    // overall dims
    const W=b.x1-b.x0, D=b.y1-b.y0; const dy=Y(b.y0)+.7*k, dx=X(b.x0)-.7*k;
    L(X(b.x0),dy,X(b.x1),dy,.5,grey); L(X(b.x0),dy-4,X(b.x0),dy+4,.5,grey); L(X(b.x1),dy-4,X(b.x1),dy+4,.5,grey); T(`${W.toFixed(2)} m`,X(b.x0+W/2),dy+4,{size:7,align:'center',color:grey});
    T('STREET / FRONT',X(b.x0+W/2),dy+14,{size:6.5,align:'center',bold:true,color:grey});
    L(dx,Y(b.y0),dx,Y(b.y1),.5,grey); L(dx-4,Y(b.y0),dx+4,Y(b.y0),.5,grey); L(dx-4,Y(b.y1),dx+4,Y(b.y1),.5,grey); T(`${D.toFixed(2)} m`,dx-4,Y(b.y0+D/2),{size:7,align:'center',color:grey,rotate:90});
    // title block
    const tx=PW-M-TB, tw=TB; L(tx,M-8,tx,PH-M+8,1,ink);
    let y=PH-M-10; const line=()=>{ L(tx,y,PW-M+8,y,.5,light); y-=14; };
    T(DISC[disc].title.toUpperCase(),tx+10,y-6,{bold:true,size:12}); y-=24; T(LEVELS[lv],tx+10,y,{size:10}); y-=14; line();
    const kv=(a,v)=>{ T(a,tx+10,y,{size:6.5,color:grey}); T(v,tx+tw-4,y,{size:7.5,align:'right'}); y-=12; };
    kv('Project',S.meta.name||'House'); kv('Scale',`1:${sc} @ A3`); kv('Date',new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})); kv('Drawing',`${DISC[disc].code}-${lv}`); kv('Sheet',`${sheet} of ${total}`); kv('Dimensions','metres'); y-=2; line();
    if(disc==='arch'){ T('ROOM SCHEDULE',tx+10,y,{bold:true,size:7.5}); y-=13; let tot=0;
      for(const r of rs){ if(y<M+40) break; T(r.name,tx+10,y,{size:6.8}); T(`${(+r.w).toFixed(2)} x ${(+r.d).toFixed(2)}`,tx+tw-58,y,{size:6.8,align:'right',color:grey}); T(`${(r.w*r.d).toFixed(1)} m²`,tx+tw-4,y,{size:6.8,align:'right'}); y-=11; if(!r.outdoor) tot+=r.w*r.d; }
      y-=3; T('Indoor floor area',tx+10,y,{bold:true,size:7}); T(`${tot.toFixed(1)} m²`,tx+tw-4,y,{bold:true,size:7,align:'right'}); y-=14;
      T('D = door, W = window, O = opening, with clear width (m)',tx+10,y,{size:6,color:grey}); }
    else if(disc==='walls'){ T('LEGEND',tx+10,y,{bold:true,size:7.5}); y-=13; for(const s of STAGES){ L(tx+10,y+3,tx+28,y+3,3,hexRgb(s.color)); T('Needs '+s.label.toLowerCase(),tx+34,y,{size:6.8}); y-=11; } L(tx+10,y+3,tx+28,y+3,3,hexRgb('#2c8a4b')); T('All stages finished',tx+34,y,{size:6.8}); y-=16;
      T('SCHEDULE (o = needed, x = done)',tx+10,y,{bold:true,size:7.5}); y-=12; const cols=['Sh','Pl','Re','Pa']; cols.forEach((c,i)=>T(c,tx+tw-4-(3-i)*26,y,{size:6.2,align:'right',color:grey})); y-=10;
      for(const r of rs){ if(y<M+30) break; const w=r.walls||{}; const surf=WALLS.filter(s=>STAGES.some(g=>(w[s.key]||{})[g.key])); if(!surf.length) continue; T(r.name,tx+10,y,{bold:true,size:6.6}); y-=10;
        for(const s of surf){ if(y<M+20) break; T('  '+s.label,tx+10,y,{size:6.4}); STAGES.forEach((g,i)=>{ const v=(w[s.key]||{})[g.key]; if(v) T(v==='done'?'x':'o',tx+tw-4-(3-i)*26,y,{size:6.6,align:'right',bold:v==='done'}); }); y-=9.5; } } }
    else { T('LEGEND',tx+10,y,{bold:true,size:7.5}); y-=14; const types=PTYPES.filter(p=>secs.includes(p.sector));
      for(const ty of types){ const n=pts.filter(p=>p.type===ty.key); const c=hexRgb(SEC[ty.sector].color); pg.drawCircle({x:tx+16,y:y+2.5,size:5,borderColor:c,borderWidth:1,color:P.rgb(1,1,1)}); T(ty.g,tx+16,y+.6,{bold:true,size:ty.g.length>1?3.8:5,align:'center',color:c}); T(ty.label,tx+28,y,{size:6.8}); T(`${n.filter(p=>p.done).length}/${n.length}`,tx+tw-4,y,{size:6.8,align:'right'}); y-=12; }
      T('Filled symbol = installed. Counts = installed / planned.',tx+10,y,{size:6,color:grey}); y-=16;
      T('SCHEDULE BY ROOM',tx+10,y,{bold:true,size:7.5}); y-=12;
      for(const r of rs){ const l=pts.filter(p=>p.roomId===r.id); if(!l.length) continue; if(y<M+20) break; const parts=types.map(ty=>{const n=l.filter(p=>p.type===ty.key).length; return n?`${n} ${ty.g}`:''}).filter(Boolean).join(', ');
        T(r.name,tx+10,y,{size:6.6}); T(parts,tx+tw-4,y,{size:6.4,align:'right',color:grey}); y-=10; }
      if(!pts.length) T('No points placed on this level yet.',tx+10,y,{size:6.6,color:grey}); }
    T('Drawn from site measurements. Check on site before work.',tx+10,M,{size:5.8,color:grey});
  }
  return await pdf.save();
}

/* ---------- Extra event handlers ---------- */
function handleExtraClick(t,e){
  const ib=t.closest('[data-item]'); if(ib){ openItem(ib.dataset.item); return true; }
  if(t.closest('#addItem')){ openItem(null); return true; }
  const bc=t.closest('[data-bcat]'); if(bc){ UI.bf.cat=bc.dataset.bcat; renderBudget(); return true; }
  if(t.closest('#expBtn')){ exportPDF(); return true; }
  const sl=t.closest('[data-slevel]'); if(sl){ UI.setupLevel=Number(sl.dataset.slevel); UI.setupSel=null; renderSetup(); return true; }
  const ss=t.closest('[data-ssel]'); if(ss){ UI.setupSel=ss.dataset.ssel; renderSetup(); return true; }
  const sr=t.closest('[data-srm]'); if(sr){ UI.setupSel=sr.dataset.srm; renderSetup(); return true; }
  const rd=t.closest('[data-rdel]'); if(rd){ const id=rd.dataset.rdel; if(UI.confirmDel===id){ deleteRoom(id); UI.confirmDel=null; if(UI.setupSel===id) UI.setupSel=null; } else { UI.confirmDel=id; renderSetup(); } return true; }
  if(t.closest('#suAddRoom')){ const lv=UI.setupLevel; const rs=roomList().filter(r=>r.level===lv); const y=rs.length?Math.max(...rs.map(r=>r.y+r.d)):0; const id=uid('r'); UI.setupSel=id; saveRoom(id,{name:'New room',level:lv,x:0,y:Math.round(y*100)/100,w:3,d:3,outdoor:false,notes:'',walls:{},images:[],openings:[]}); return true; }
  const oa=t.closest('[data-oadd]'); if(oa){ const r=clone(S.rooms[UI.setupSel]); r.openings=r.openings||[]; r.openings.push({wall:'front',type:oa.dataset.oadd,offset:0.3,width:oa.dataset.oadd==='door'?0.8:oa.dataset.oadd==='window'?1.0:0.9,hinge:'start'}); saveRoom(UI.setupSel,r); return true; }
  const od=t.closest('[data-odel]'); if(od){ const r=clone(S.rooms[UI.setupSel]); r.openings.splice(Number(od.dataset.odel),1); saveRoom(UI.setupSel,r); return true; }
  if(t.closest('#suDone')){ saveMeta({setupDone:true}); go('house'); return true; }
  if(t.closest('#csvCur')){ UI.csv.text=roomsCSV(); UI.csv.msg=''; renderSetup(); return true; }
  if(t.closest('#csvDl')){ CAP.downloads.save({filename:'house rooms.csv',data:roomsCSV()}).catch(err=>{ if(err&&err.code!=='declined') toast('Could not save the CSV.'); }); return true; }
  if(t.closest('#bkSave')){ CAP.downloads.save({filename:`house-hub-backup-${todayISO()}.json`,data:backupJSON()}).then(()=>{ saveMeta({lastBackup:todayISO()}); toast('Backup saved.'); }).catch(err=>{ if(err&&err.code!=='declined') toast('Could not save the backup.'); }); return true; }
  if(t.closest('#bkCopy')){ navigator.clipboard.writeText(backupJSON()).then(()=>toast('Backup copied. Paste it into a .json file in your data repo.')).catch(()=>toast('Copy was blocked here. Use Download backup instead.')); return true; }
  if(t.closest('#bkCancel')){ UI.restore=null; renderSetup(); return true; }
  if(t.closest('#bkGo')){ if(!UI.restore.sure){ UI.restore.sure=true; renderSetup(); return true; } restoreBackup(UI.restore.data); UI.restore=null; toast('Backup restored.'); go('house'); return true; }
  if(t.closest('#csvGo')){ UI.csv.text=$('#csvText').value; importCSV(); renderSetup(); return true; }
  return false;
}
function handleExtraChange(t){
  if(t.id==='bcat'){ UI.bf.cat=t.value; renderBudget(); return true; }
  if(t.id==='broom'){ UI.bf.room=t.value; renderBudget(); return true; }
  if(t.dataset.expd){ UI.exp.disc[t.dataset.expd]=t.checked; return true; }
  if(t.dataset.expl!=null){ UI.exp.levels[Number(t.dataset.expl)]=t.checked; return true; }
  if(t.id==='suName'){ saveMeta({name:t.value.trim()||'My house'}); return true; }
  if(t.id==='suW'){ saveMeta({width:Math.max(0,Number(t.value)||0)}); return true; }
  if(t.id==='suD'){ saveMeta({depth:Math.max(0,Number(t.value)||0)}); return true; }
  if(t.dataset.height!=null){ const h=[...(S.meta.heights||[2.9,2.9,2.4])]; h[Number(t.dataset.height)]=Math.max(1,Number(t.value)||2.7); saveMeta({heights:h}); return true; }
  if(t.dataset.rf){ const id=t.dataset.rid, f=t.dataset.rf; if(!S.rooms[id]) return true; let v=f==='outdoor'?t.checked:f==='name'?(t.value.trim()||'Room'):Number(t.value); if(f==='w'||f==='d') v=Math.max(.3,v||.3); if((f==='x'||f==='y')&&isNaN(v)) v=0; moveRoom(id,{[f]:v}); return true; }
  if(t.dataset.of){ const r=clone(S.rooms[UI.setupSel]); const o=r.openings[Number(t.dataset.oi)]; const f=t.dataset.of; o[f]=(f==='offset'||f==='width')?Math.max(0,Number(t.value)||0):t.value; saveRoom(UI.setupSel,r); return true; }
  if(t.id==='bkFile'){ const f=t.files[0]; if(!f) return true; f.text().then(txt=>{ let d; try{ d=JSON.parse(txt); }catch(_){ toast('That file is not valid JSON.'); return; }
      if(!d||d.app!=='house-hub'||typeof d.rooms!=='object'){ toast('That file is not a House hub backup.'); return; }
      const n=k=>Object.keys(d[k]||{}).length; UI.restore={name:f.name,data:d,when:d.exported?new Date(d.exported).toLocaleString('en-GB'):'unknown date',counts:`${n('rooms')} rooms, ${n('tasks')} tasks, ${n('points')} points, ${n('items')} items`,sure:false}; renderSetup(); }); t.value=''; return true; }
  if(t.id==='csvPrune'){ UI.csv.prune=t.checked; return true; }
  if(t.id==='csvFile'){ const f=t.files[0]; if(!f) return true; f.text().then(txt=>{ UI.csv.text=txt; UI.csv.msg='Loaded '+f.name+'. Check it, then press Import.'; UI.csv.err=false; renderSetup(); }); return true; }
  return false;
}
document.addEventListener('input',e=>{ const t=e.target; if(t.id==='bq'){ UI.bf.q=t.value; clearTimeout(window._bq); window._bq=setTimeout(()=>{ const pos=t.selectionStart; t.blur(); renderBudget(); const n=$('#bq'); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){}} },250); } if(t.id==='csvText') UI.csv.text=t.value; });

/* ---------- Routing ---------- */
const VIEWS=['house','tasks','timeline','plans','dump','budget','setup'];
function go(v){ UI.view=v; if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); const a=document.activeElement; a&&a.blur&&a.blur(); deferred=false; $('#main').innerHTML=''; render(); }
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)&&h!==UI.view) go(h); });
window.addEventListener('resize',()=>{ if(UI.view==='house'&&UI.dim==='3d'){ UI.zoom=null; build3D(); } });

/* ---------- Boot ---------- */
(async function boot(){
  const h=location.hash.slice(1); if(VIEWS.includes(h)) UI.view=h;
  render();
  await store.init();
  store.watch('rooms',o=>{S.rooms=o; S.loaded.rooms=true; scheduleRender();});
  store.watch('tasks',o=>{S.tasks=o; S.loaded.tasks=true; scheduleRender();});
  store.watch('points',o=>{S.points=o; S.loaded.points=true; scheduleRender();});
  store.watch('items',o=>{S.items=o; scheduleRender();});
  store.watchDoc('meta/house',m=>{ if(m) S.meta={...S.meta,...m}; scheduleRender(); });
  window.HUB={S,store,UI};
})();
