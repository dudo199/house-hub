<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Completion Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a site office. Top bar with overall progress, one working surface per view; the house view is a turnable 3D site model with a side rail. */
  --paper:#e9ecea; --panel:#f8f9f8; --ink:#1b2226; --muted:#5d686f; --line:#cfd5d3; --accent:#2454c0;
  --accent-soft:#dfe7f8; --accent-ink:#fff; --good:#2c8a4b; --warn:#c08308; --bad:#bf3f2c;
  --floor:#dfe3df; --floor-out:#d4dccb; --wall:rgba(120,132,138,.34); --wall-top:#7d878c; --stage:#dde2df; --stage2:#cfd6d3;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181c; --panel:#192127; --ink:#e3e8ea; --muted:#94a1a8; --line:#2c373e; --accent:#7ea2ff;
    --accent-soft:#22304f; --accent-ink:#0f1418; --good:#55b877; --warn:#e0a83a; --bad:#ec6d58;
    --floor:#2a343a; --floor-out:#2b3a2f; --wall:rgba(150,165,172,.22); --wall-top:#8a979e; --stage:#151c21; --stage2:#0f1418;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12181c; --panel:#192127; --ink:#e3e8ea; --muted:#94a1a8; --line:#2c373e; --accent:#7ea2ff;
  --accent-soft:#22304f; --accent-ink:#0f1418; --good:#55b877; --warn:#e0a83a; --bad:#ec6d58;
  --floor:#2a343a; --floor-out:#2b3a2f; --wall:rgba(150,165,172,.22); --wall-top:#8a979e; --stage:#151c21; --stage2:#0f1418;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--body);display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* Top bar */
.top{display:flex;align-items:center;gap:20px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:150px}
.brand h1{font-size:20px;line-height:1.1}
.brand .sub{font-size:12px;color:var(--muted)}
.overall{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;min-width:220px;flex:1;max-width:420px}
.overall .pct{font:700 26px/1 var(--display);grid-row:span 2}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--good);border-radius:4px}
.overall .meta{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px;margin-left:auto}
nav.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:600 13px var(--display);letter-spacing:.02em;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.banner{padding:6px 18px;font-size:12.5px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner:empty{display:none}
main{overflow:auto;min-height:0;position:relative}

/* Segmented controls and chips */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{font:600 10.5px var(--display);letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:4px}
.pill.todo{background:var(--line);color:var(--ink)}
.pill.doing{background:var(--accent-soft);color:var(--accent)}
.pill.waiting{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.high{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.due.over{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{width:100%}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;font-size:13.5px;color:var(--ink);min-width:0}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* House view */
.house{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%;min-height:520px}
.stage-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.stage-tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
#stage{flex:1;position:relative;overflow:hidden;perspective:2400px;perspective-origin:50% 38%;cursor:grab;touch-action:none;min-height:380px;
  background:radial-gradient(ellipse at 50% 40%,var(--stage),var(--stage2))}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.lvl{position:absolute;left:0;top:0;transform-style:preserve-3d}
.rm{position:absolute;transform-style:preserve-3d}
.fl{position:absolute;inset:0;border:1px solid var(--wall-top);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:2px;overflow:hidden;
  font:600 12px/1.1 var(--display);color:var(--ink);transform:translateZ(.5px)}
.fl:hover{filter:brightness(1.06)}
.fl.sel{outline:3px solid var(--accent);outline-offset:-3px}
.fl .p{font:500 10.5px var(--mono);color:var(--muted)}
.wl{position:absolute;transform-origin:0 100%;pointer-events:none;border-top:2px solid var(--wall-top)}
.lvl-label{position:absolute;font:700 13px var(--display);letter-spacing:.12em;color:var(--muted);white-space:nowrap;pointer-events:none;transform:translateZ(1px)}
.pt3{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:2px solid;transform:translateZ(3px);pointer-events:none;background:var(--panel)}
.stage-foot{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:auto;max-width:70%}
.legend span{display:inline-flex;align-items:center;gap:5px}
.zoom{display:flex;flex-direction:column;gap:4px;pointer-events:auto}
.zoom button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:16px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}

.rail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.rail section{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rail h2{font-size:16px}
.rail h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:13px;cursor:pointer;padding:3px 0}
.sec-row .bar{grid-column:span 2;height:6px}
.sec-row .n{font:500 12px var(--mono);color:var(--muted)}
.task-li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.task-li:first-child{border-top:0}
.task-li .t{cursor:pointer}
.task-li .t b{font-weight:500}
.task-li .sub{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.task-li input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--good)}
.task-li.done b{text-decoration:line-through;color:var(--muted)}
.rtabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.rtabs button{border:0;background:transparent;padding:9px 9px;font:600 12.5px var(--display);color:var(--muted);border-bottom:2px solid transparent}
.rtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.walltbl{border-collapse:collapse;width:100%;font-size:12.5px}
.walltbl th{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:4px 2px}
.walltbl th:first-child,.walltbl td:first-child{text-align:left}
.walltbl td{padding:4px 2px;border-top:1px solid var(--line);text-align:center}
.wcell{width:34px;height:26px;border-radius:6px;border:1px dashed var(--line);background:transparent;font-size:13px;line-height:1}
.wcell.need{border:2px solid var(--c);color:var(--c);background:transparent}
.wcell.done{border:2px solid var(--good);background:var(--good);color:#fff}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);position:relative}
.gallery img{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in}
.gallery figcaption{font-size:11.5px;padding:4px 6px;display:flex;justify-content:space-between;gap:4px;align-items:center}
.ai-out{font-size:13px;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ai-out:empty{display:none}

/* Tasks board */
.page{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:160px}
.col header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.col header h2{font-size:14px;letter-spacing:.03em}
.col .cards{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:80px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:7px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.card.dragging{opacity:.4}
.sector-filter{display:flex;gap:6px;flex-wrap:wrap}
.sector-filter button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.sector-filter button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}

/* Timeline */
.tl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 230px)}
.tl{position:relative;min-width:100%}
.tl-head{position:sticky;top:0;z-index:3;background:var(--panel);display:flex;border-bottom:1px solid var(--line)}
.tl-head .lab,.tl-row .lab{position:sticky;left:0;z-index:2;background:var(--panel);width:240px;flex:none;padding:5px 10px;border-right:1px solid var(--line);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{position:relative;flex:none}
.tl-head .wk{position:absolute;top:0;bottom:0;font:500 10.5px var(--mono);color:var(--muted);padding:6px 4px;border-left:1px solid var(--line);white-space:nowrap}
.tl-row{display:flex;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);min-height:30px}
.tl-row.grp .lab{font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.tl-row.grp{background:var(--paper)}
.tl-row.grp .lab{background:var(--paper)}
.tl-bar{position:absolute;top:6px;height:18px;border-radius:5px;background:var(--c);opacity:.9;cursor:pointer;font-size:11px;color:#fff;padding:0 6px;white-space:nowrap;overflow:hidden;line-height:18px}
.tl-bar.done{opacity:.35}
.tl-bar.prop{outline:2px dashed var(--accent);outline-offset:1px}
.tl-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:1;pointer-events:none}
.tl-line.target{border-left:2px dashed var(--bad)}
.tl-line span{position:absolute;top:2px;left:4px;font:600 10px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--panel);padding:0 3px;white-space:nowrap}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent);pointer-events:none}

/* Plans */
.plans{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:0;height:100%;min-height:520px}
.plans aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.plans aside.right{border-right:0;border-left:1px solid var(--line)}
.tools{display:grid;grid-template-columns:1fr;gap:4px}
.tools button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px;font-size:12.5px;text-align:left}
.tools button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.glyph{width:20px;height:20px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:inline-flex;align-items:center;justify-content:center;font:700 9px var(--mono);flex:none}
.plan-stage{overflow:auto;padding:14px;display:flex;align-items:flex-start;justify-content:center;background:var(--paper)}
.plan-stage svg{max-width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.plan-stage svg.placing{cursor:crosshair}
.pt-list{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.pt-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
.pt-row:hover,.pt-row.sel{background:var(--accent-soft)}

/* Brain dump */
.dump{max-width:1100px;margin:0 auto;width:100%}
.dump textarea{width:100%;min-height:170px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.dump-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mic[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.prop-tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prop-tbl th{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.prop-tbl td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.prop-tbl input[type=text]{width:100%}
.prop-tbl .inp{width:100%}
.tbl-wrap{overflow-x:auto}

/* Modal, lightbox, toast */
.overlay{position:fixed;inset:0;background:rgba(10,14,16,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;border:1px solid var(--line);width:min(560px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .row-end{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.lightbox img{max-width:min(1100px,92vw);max-height:86vh;border-radius:8px;display:block}
.lightbox{flex-direction:column;gap:8px;color:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* 2D house plan */
#plan2d{position:absolute;inset:0;padding:16px 16px 70px;display:none}
#plan2d svg{width:100%;height:100%}
#stage.flat{cursor:default;background:var(--paper)}
#stage.flat #plan2d{display:block}
#stage.flat #world{display:none}
#plan2d [data-room2]{cursor:pointer}
#plan2d [data-room2]:hover{filter:brightness(1.06)}
.placeholder-note{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border-bottom:1px solid var(--line);padding:12px 16px;font-size:13px;display:flex;flex-direction:column;gap:6px}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:0;height:100%;min-height:520px}
.setup .form{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px;background:var(--panel);border-right:1px solid var(--line)}
.setup .form section{display:flex;flex-direction:column;gap:10px}
.setup h2{font-size:17px}
.step{font:600 11px var(--mono);color:var(--accent);letter-spacing:.04em}
.rtbl{border-collapse:collapse;width:100%;font-size:12.5px}
.rtbl th{font:600 10.5px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 3px}
.rtbl td{padding:3px;border-top:1px solid var(--line)}
.rtbl input[type=number]{width:58px}
.rtbl input[type=text]{width:100%;min-width:110px}
.rtbl tr.sel td{background:var(--accent-soft)}
.rtbl .inp{padding:4px 6px;font-size:12.5px}
.setup .preview{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.setup .preview svg{width:100%;height:auto;max-height:calc(100vh - 200px);background:var(--panel);border:1px solid var(--line);border-radius:8px}
.warn-list{font-size:12.5px;color:var(--warn);margin:0;padding-left:18px}
.okline{font-size:12.5px;color:var(--good)}
.csv{font:12px/1.4 var(--mono);width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px}

/* Budget */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.budget-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.btbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.btbl th{font:600 10.5px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.btbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.btbl tr[data-item]{cursor:pointer}
.btbl tr[data-item]:hover td{background:var(--paper)}
.btbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btbl tr.cat td{background:var(--paper);font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill.idea{background:var(--line);color:var(--ink)}
.pill.quoted{background:var(--accent-soft);color:var(--accent)}
.pill.ordered{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.paid,.pill.delivered{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.quotes{display:flex;flex-direction:column;gap:8px}
.quote{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;grid-template-columns:auto 1fr 110px auto;gap:6px 8px;align-items:center}
.quote.chosen{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--panel))}
.quote .wide{grid-column:2 / span 3;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quote .best{font:600 10px var(--display);color:var(--good);letter-spacing:.06em;text-transform:uppercase}
.export{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.export label{display:flex;gap:8px;align-items:center;font-size:13px}

@media (max-width:980px){
  .setup{grid-template-columns:1fr;height:auto}
  .setup .form{border-right:0;border-bottom:1px solid var(--line)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .budget-grid{grid-template-columns:1fr}
}
@media (max-width:980px){
  body{overflow:auto;display:block}
  main{overflow:visible}
  .house{grid-template-columns:1fr;height:auto}
  #stage{height:60vh;flex:none}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .plans{grid-template-columns:1fr;height:auto}
  .plans aside{border-right:0;border-bottom:1px solid var(--line)}
  .tools{grid-template-columns:repeat(2,1fr)}
  nav.tabs{margin-left:0;overflow-x:auto;max-width:100%}
  .board{grid-template-columns:repeat(4,minmax(240px,1fr))}
}
@media (max-width:480px){ .grid2,.grid3{grid-template-columns:1fr} .top{gap:10px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<body>
<header class="top">
  <div class="brand"><h1 id="houseName">House</h1><span class="sub" id="houseSub">3 levels</span></div>
  <div class="overall" id="overall"></div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-view="house">House</button>
    <button data-view="tasks">Tasks</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="plans">Plans</button>
    <button data-view="dump">Brain dump</button>
    <button data-view="budget">Budget</button>
    <button data-view="setup">Setup</button>
  </nav>
  <button class="btn primary" id="newTaskBtn" type="button">+ New task</button>
</header>
<div class="banner" id="banner"></div>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Constants ---------- */
const SECTORS=[
  {key:'walls',label:'Plastering & wall works',color:'#a47a45'},
  {key:'electrical',label:'Electrical',color:'#d29500'},
  {key:'plumbing',label:'Plumbing',color:'#2e7bd6'},
  {key:'painting',label:'Painting',color:'#c2457a'},
  {key:'furniture',label:'Furniture & kitchen',color:'#2a9680'},
  {key:'lighting',label:'Lighting',color:'#8a5fd4'}
];
const SEC=Object.fromEntries(SECTORS.map(s=>[s.key,s]));
const STATUSES=[{key:'todo',label:'To do'},{key:'doing',label:'In progress'},{key:'waiting',label:'Waiting'},{key:'done',label:'Done'}];
const STAT=Object.fromEntries(STATUSES.map(s=>[s.key,s]));
const LEVELS=['Ground floor','First floor','Roof'];
const WALLS=[{key:'front',label:'Front'},{key:'right',label:'Right'},{key:'back',label:'Back'},{key:'left',label:'Left'},{key:'ceiling',label:'Ceiling'}];
const STAGES=[
  {key:'shave',label:'Shave off',short:'Shave',sector:'walls',color:'#b4502f'},
  {key:'plaster',label:'Plaster',short:'Plaster',sector:'walls',color:'#a47a45'},
  {key:'render',label:'Render',short:'Render',sector:'walls',color:'#5f7c93'},
  {key:'paint',label:'Paint',short:'Paint',sector:'painting',color:'#c2457a'}
];
const PTYPES=[
  {key:'socket',label:'Socket',sector:'electrical',g:'S'},
  {key:'switch',label:'Switch',sector:'electrical',g:'SW'},
  {key:'data',label:'Data / TV',sector:'electrical',g:'TV'},
  {key:'ac',label:'A/C unit',sector:'electrical',g:'AC'},
  {key:'cu',label:'Consumer unit',sector:'electrical',g:'CU'},
  {key:'light',label:'Light point',sector:'lighting',g:'L'},
  {key:'cold',label:'Cold water',sector:'plumbing',g:'C'},
  {key:'hot',label:'Hot water',sector:'plumbing',g:'H'},
  {key:'waste',label:'Waste / drain',sector:'plumbing',g:'W'},
  {key:'gas',label:'Gas',sector:'plumbing',g:'G'}
];
const PT=Object.fromEntries(PTYPES.map(p=>[p.key,p]));
const CATS=[
  {key:'kitchen',label:'Kitchen units & worktops'},{key:'appliances',label:'Kitchen appliances'},{key:'lighting',label:'Lighting fixtures'},
  {key:'materials',label:'Building materials'},{key:'electrical',label:'Electrical supplies'},{key:'plumbing',label:'Plumbing & sanitaryware'},
  {key:'paint',label:'Paint & finishes'},{key:'tiles',label:'Tiles & flooring'},{key:'furniture',label:'Furniture'},{key:'labour',label:'Labour & contractors'},{key:'other',label:'Other'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.key,c]));
const ISTAT=[{key:'idea',label:'Idea'},{key:'quoted',label:'Quoted'},{key:'ordered',label:'Ordered'},{key:'paid',label:'Paid'},{key:'delivered',label:'Delivered'}];
const IST=Object.fromEntries(ISTAT.map(s=>[s.key,s]));
const OPEN_TYPES=[{key:'door',label:'Door'},{key:'window',label:'Window'},{key:'opening',label:'Opening / arch'}];
const eur=n=>n==null||isNaN(n)?'—':new Intl.NumberFormat('en-MT',{style:'currency',currency:'EUR',maximumFractionDigits:n%1?2:0}).format(n);
const SCALE=34; // px per metre in the 3D model

/* ---------- State ---------- */
const S={rooms:{},tasks:{},points:{},items:{},meta:{name:'The Townhouse',target:'',daysPerWeek:3,width:0,depth:0,heights:[2.9,2.9,2.4],setupDone:false},loaded:{rooms:false,tasks:false,points:false}};
const UI={view:'house',level:'all',layer:'progress',full:false,spin:-32,tilt:52,zoom:null,room:null,roomTab:'tasks',editRoom:null,
  tf:{sectors:[],room:'',q:''},planLevel:0,tool:'select',planSel:null,planLayers:{walls:true,electrical:true,plumbing:true},
  dump:{text:'',rows:null,busy:false,summary:''},tl:{proposal:null,busy:false,note:''},advice:{text:'',busy:false},showAllDone:false,
  dim:'3d',setupLevel:0,setupSel:null,csv:{text:'',prune:false,msg:''},bf:{cat:'',q:'',room:''},
  exp:{disc:{arch:true,elec:true,plumb:true,walls:false},levels:[true,true,true],busy:false}};
let CAP={sample:null,dictation:null,assets:null,downloads:null};
const itemList=()=>Object.entries(S.items).map(([id,t])=>({id,...t}));

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const fmtD=s=>s?toDate(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const validISO=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
const roomList=()=>Object.entries(S.rooms).map(([id,r])=>({id,...r})).sort((a,b)=>(a.level-b.level)||(a.y-b.y)||(a.x-b.x));
const taskList=()=>Object.entries(S.tasks).map(([id,t])=>({id,...t}));
const pointList=()=>Object.entries(S.points).map(([id,p])=>({id,...p}));
const roomName=id=>S.rooms[id]?.name||'';
const isOver=t=>t.status!=='done'&&t.due&&t.due<todayISO();

/* ---------- Store (db when available, memory otherwise) ---------- */
const store={db:null,mem:{rooms:{},tasks:{},points:{},items:{},meta:{}},subs:{},queues:{},
  async init(){
    let use=null;
    for(let i=0;i<20&&!use;i++){ if(window.claude&&typeof window.claude.use==='function') use=window.claude.use; else await new Promise(r=>setTimeout(r,100)); }
    if(!use){ setBanner('Preview mode: changes are not saved here. Open the published page to keep your data.'); return; }
    try{ this.db=await window.claude.use('db'); }catch(e){ this.db=null; }
    if(!this.db) setBanner('Saving is unavailable in this view, so changes last only until you close the page.');
    const get=n=>window.claude.use(n).catch(()=>null);
    [CAP.sample,CAP.dictation,CAP.assets,CAP.downloads]=await Promise.all([get('sample'),get('dictation'),get('assets'),get('downloads')]);
    if(CAP.dictation){
      CAP.dictation.onFinal(({text})=>{ const ta=$('#dumpText'); const add=(text||'').trim(); if(!add) return; UI.dump.text=(UI.dump.text?UI.dump.text.replace(/\s*$/,' '):'')+add; if(ta){ta.value=UI.dump.text;} });
      CAP.dictation.onPartial(({text})=>{ const el=$('#partial'); if(el) el.textContent=text||''; });
      CAP.dictation.onState(({state})=>{ UI.listening=state==='listening'; const b=$('#micBtn'); if(b){b.setAttribute('aria-pressed',UI.listening?'true':'false');b.textContent=UI.listening?'■ Stop':'🎙 Speak';} if(!UI.listening){const el=$('#partial'); if(el) el.textContent='';} });
    }
  },
  watch(col,cb){
    if(this.db){
      const timer=setTimeout(()=>setBanner('Your saved data is taking a while to load. It may be out of date until it arrives.'),10000);
      this.db.collection(col).onSnapshot(snap=>{ if(!snap.metadata.fromCache){clearTimeout(timer); if($('#banner').dataset.slow) setBanner('');} const o={}; snap.docs.forEach(d=>{o[d.id]=d.data()}); cb(o); },
        err=>{clearTimeout(timer); setBanner('Could not load '+col+' ('+(err&&err.code||'error')+'). Reload the page to try again.');});
    } else { (this.subs[col]=this.subs[col]||[]).push(cb); cb({...this.mem[col]}); }
  },
  watchDoc(path,cb){
    if(this.db){ this.db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null),()=>{}); }
    else { const [c,id]=path.split('/'); cb(this.mem[c][id]||null); (this.subs[path]=this.subs[path]||[]).push(cb); }
  },
  _q(path,fn){ const p=(this.queues[path]||Promise.resolve()).then(fn).catch(e=>{ console.error(e); toast(e&&e.code==='quota_exceeded'?'Storage is full: delete some items and try again.':'Could not save that change. Try again.'); }); this.queues[path]=p; return p; },
  put(col,id,data){
    S[col==='meta'?'_meta':col];
    if(col!=='meta'){ S[col][id]=data; } else { S.meta={...S.meta,...data}; }
    scheduleRender();
    const path=col+'/'+id;
    if(this.db) return this._q(path,()=>this.db.doc(path).set(data));
    this.mem[col][id]=data; (this.subs[col]||[]).forEach(cb=>cb({...this.mem[col]})); (this.subs[path]||[]).forEach(cb=>cb(data));
  },
  del(col,id){
    delete S[col][id]; scheduleRender();
    const path=col+'/'+id;
    if(this.db) return this._q(path,()=>this.db.doc(path).delete());
    delete this.mem[col][id]; (this.subs[col]||[]).forEach(cb=>cb({...this.mem[col]}));
  }
};
function setBanner(t){const b=$('#banner'); b.textContent=t; b.dataset.slow=t.startsWith('Your saved data')?'1':'';}
const saveTask=(id,t)=>store.put('tasks',id,t);
const saveRoom=(id,r)=>store.put('rooms',id,r);
const savePoint=(id,p)=>store.put('points',id,p);
const saveMeta=m=>store.put('meta','house',{...S.meta,...m});

/* ---------- Progress ---------- */
function items(filter={}){
  const out=[];
  for(const t of taskList()){ if(filter.room&&t.roomId!==filter.room) continue; out.push({sector:t.sector,done:t.status==='done'}); }
  for(const r of roomList()){ if(filter.room&&r.id!==filter.room) continue; const w=r.walls||{};
    for(const wk of WALLS){ const st=w[wk.key]||{}; for(const sg of STAGES){ if(st[sg.key]) out.push({sector:sg.sector,done:st[sg.key]==='done'}); } } }
  for(const p of pointList()){ if(filter.room&&p.roomId!==filter.room) continue; const ty=PT[p.type]; if(ty) out.push({sector:ty.sector,done:!!p.done}); }
  return out;
}
function progress(list){ const total=list.length, done=list.filter(i=>i.done).length; return {total,done,pct:total?Math.round(done/total*100):null}; }
function bySector(){ const all=items(); const o={}; for(const s of SECTORS){ o[s.key]=progress(all.filter(i=>i.sector===s.key)); } return o; }
function pctColor(p,alpha=1){ if(p==null) return null; const h=8+(135-8)*(p/100); return `hsla(${h},62%,${document.documentElement.dataset.theme==='dark'||matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'?40:55}%,${alpha})`; }
function wallState(st){ st=st||{}; const req=STAGES.filter(s=>st[s.key]); if(!req.length) return null; const next=req.find(s=>st[s.key]!=='done'); return next?{color:next.color,label:next.label}:{color:'var(--good)',label:'Finished'}; }

/* ---------- Rendering ---------- */
let renderPending=false, deferred=false;
function scheduleRender(){ if(renderPending) return; renderPending=true; requestAnimationFrame(()=>{renderPending=false; render();}); }
function isTyping(){ const a=document.activeElement; return a&&$('#main').contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','button','file','radio'].includes(a.type))||a.tagName==='SELECT'); }
document.addEventListener('focusout',()=>{ if(deferred){ setTimeout(()=>{ if(!isTyping()){deferred=false; render();} },0);} });
function render(){
  renderTop();
  if(isTyping()){ deferred=true; return; }
  const v=UI.view;
  if(v==='house') renderHouse(); else if(v==='tasks') renderTasks(); else if(v==='timeline') renderTimeline(); else if(v==='plans') renderPlans(); else if(v==='budget') renderBudget(); else if(v==='setup') renderSetup(); else renderDump();
}
function renderTop(){
  $('#houseName').textContent=S.meta.name||'My house';
  const rooms=roomList(); const p=progress(items());
  $('#houseSub').textContent=`${LEVELS.length} levels · ${rooms.length} rooms`;
  let meta=`${p.done} of ${p.total} items done`;
  if(S.meta.target){ const d=daysBetween(todayISO(),S.meta.target); meta+= d>=0?` · ${Math.ceil(d/7)} weeks to target (${fmtD(S.meta.target)})`:` · target date passed`; }
  $('#overall').innerHTML=`<div class="pct num">${p.pct??0}%</div><div class="bar" title="Overall progress"><i style="width:${p.pct??0}%"></i></div><div class="meta num">${esc(meta)}</div>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===UI.view?'page':'false'));
}

/* ----- House (3D) ----- */
function renderHouse(){
  const main=$('#main');
  if(!main.querySelector('.house')){
    main.innerHTML=`<section class="house">
      <div class="stage-wrap">
        <div class="stage-tools">
          <div class="seg" id="levelSeg" role="group" aria-label="Level"></div>
          <div class="seg" id="layerSeg" role="group" aria-label="Layer"></div>
          <div class="seg" role="group" aria-label="View"><button type="button" id="dim3">3D</button><button type="button" id="dim2">2D plan</button></div>
          <div class="seg" role="group" aria-label="Walls" id="wallSeg"><button type="button" id="wallLow">Cutaway</button><button type="button" id="wallFull">Full height</button></div>
        </div>
        <div id="stage"><div id="world"></div><div id="plan2d"></div>
          <div class="stage-foot"><div><div class="legend" id="legend"></div><div class="hint">Drag to turn · scroll or use + / − to zoom · click a room to open it</div></div>
          <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zreset" aria-label="Reset view" title="Reset view">⟲</button></div></div>
        </div>
      </div>
      <aside class="rail" id="rail"></aside></section>`;
    bindStage();
  }
  $('#levelSeg').innerHTML=[['all','All levels'],[0,'Ground'],[1,'First'],[2,'Roof']].map(([k,l])=>`<button type="button" data-level="${k}" aria-pressed="${String(UI.level)===String(k)}">${l}</button>`).join('');
  $('#layerSeg').innerHTML=[['progress','Progress'],['walls','Wall works'],['electrical','Electrical'],['plumbing','Plumbing']].map(([k,l])=>`<button type="button" data-layer="${k}" aria-pressed="${UI.layer===k}">${l}</button>`).join('');
  $('#wallLow').setAttribute('aria-pressed',String(!UI.full)); $('#wallFull').setAttribute('aria-pressed',String(UI.full));
  $('#dim3').setAttribute('aria-pressed',String(UI.dim==='3d')); $('#dim2').setAttribute('aria-pressed',String(UI.dim==='2d'));
  $('#wallSeg').style.display=UI.dim==='2d'?'none':''; $('#stage').classList.toggle('flat',UI.dim==='2d');
  const hint=$('#stage .hint'); if(hint) hint.textContent=UI.dim==='2d'?'Click a room to open it':'Drag to turn · scroll or use + / − to zoom · click a room to open it';
  $('#stage .zoom').style.display=UI.dim==='2d'?'none':'';
  if(UI.dim==='2d') build2D(); else build3D(); renderLegend(); renderRail();
}
function renderLegend(){
  let h='';
  if(UI.layer==='progress') h=`<span><i class="dot" style="background:${pctColor(0)}"></i>Not started</span><span><i class="dot" style="background:${pctColor(50)}"></i>Halfway</span><span><i class="dot" style="background:${pctColor(100)}"></i>Finished</span><span><i class="dot" style="background:var(--floor);border:1px solid var(--wall-top)"></i>Nothing logged yet</span>`;
  else if(UI.layer==='walls') h=STAGES.map(s=>`<span><i class="dot" style="background:${s.color}"></i>Needs ${s.label.toLowerCase()}</span>`).join('')+`<span><i class="dot" style="background:var(--good)"></i>Wall finished</span>`;
  else { const sec=UI.layer==='electrical'?['electrical','lighting']:['plumbing']; h=PTYPES.filter(p=>sec.includes(p.sector)).map(p=>`<span><span class="glyph" style="--c:${SEC[p.sector].color};width:16px;height:16px;font-size:7px">${p.g}</span>${p.label}</span>`).join('')+`<span class="muted">Filled = done</span>`; }
  $('#legend').innerHTML=h;
}
function houseBounds(){ const rs=roomList(); const fw=+S.meta.width||0, fd=+S.meta.depth||0; if(!rs.length) return {x0:0,y0:0,x1:fw||6,y1:fd||12};
  const b={x0:Math.min(...rs.map(r=>r.x)),y0:Math.min(...rs.map(r=>r.y)),x1:Math.max(...rs.map(r=>r.x+r.w)),y1:Math.max(...rs.map(r=>r.y+r.d))};
  if(fw>0&&fd>0){ b.x0=Math.min(b.x0,0); b.y0=Math.min(b.y0,0); b.x1=Math.max(b.x1,fw); b.y1=Math.max(b.y1,fd); } return b; }
function levelGap(){ return (3+(UI.level==='all'?4.2:0))*SCALE; }
function build3D(){
  const world=$('#world'); if(!world) return;
  const b=houseBounds(); const W=(b.x1-b.x0)*SCALE, D=(b.y1-b.y0)*SCALE;
  world.style.width=W+'px'; world.style.height=D+'px'; world.style.marginLeft=(-W/2)+'px'; world.style.marginTop=(-D/2)+'px';
  const levels=UI.level==='all'?[0,1,2]:[Number(UI.level)];
  const rs=roomList(); const pts=pointList();
  const showSec=UI.layer==='electrical'?['electrical','lighting']:UI.layer==='plumbing'?['plumbing']:[];
  let html='';
  levels.forEach((lv,i)=>{
    const z=i*levelGap();
    html+=`<div class="lvl" style="transform:translateZ(${z}px);width:${W}px;height:${D}px">`;
    html+=`<div class="lvl-label" style="left:${W+14}px;top:${D/2-8}px">${LEVELS[lv].toUpperCase()}</div>`;
    if(lv===levels[0]) html+=`<div class="lvl-label" style="left:0;top:-30px;width:${W}px;text-align:center">STREET ↑ FRONT</div>`;
    for(const r of rs.filter(r=>r.level===lv)){
      const x=(r.x-b.x0)*SCALE, y=(r.y-b.y0)*SCALE, w=r.w*SCALE, d=r.d*SCALE;
      const pr=progress(items({room:r.id}));
      let floor=r.outdoor?'var(--floor-out)':'var(--floor)';
      if(UI.layer==='progress'&&pr.pct!=null) floor=pctColor(pr.pct,.8);
      const H=(r.outdoor?1.0:(UI.full?(+(S.meta.heights||[])[lv]||2.7):1.1))*SCALE;
      const walls=[{k:'front',x:0,y:1,L:w,a:0},{k:'right',x:w-1,y:0,L:d,a:90},{k:'back',x:w,y:d-1,L:w,a:180},{k:'left',x:1,y:d,L:d,a:270}];
      let wh='';
      for(const wl of walls){
        let bg='var(--wall)';
        if(UI.layer==='walls'){ const s=wallState((r.walls||{})[wl.k]); if(s) bg=`color-mix(in srgb, ${s.color} 72%, transparent)`; }
        wh+=`<div class="wl" style="left:${wl.x}px;top:${wl.y-H}px;width:${wl.L}px;height:${H}px;background:${bg};transform:rotateZ(${wl.a}deg) rotateX(-90deg)"></div>`;
      }
      let ph='';
      if(showSec.length){ for(const p of pts.filter(p=>p.roomId===r.id&&PT[p.type]&&showSec.includes(PT[p.type].sector))){ const c=SEC[PT[p.type].sector].color; ph+=`<div class="pt3" style="left:${(p.x-r.x)*SCALE}px;top:${(p.y-r.y)*SCALE}px;border-color:${c};${p.done?`background:${c}`:''}"></div>`; } }
      const label=w>44&&d>30?`<span>${esc(r.name)}</span>${pr.pct!=null&&UI.layer==='progress'?`<span class="p">${pr.pct}%</span>`:''}`:'';
      html+=`<div class="rm" style="left:${x}px;top:${y}px;width:${w}px;height:${d}px"><div class="fl${UI.room===r.id?' sel':''}" data-room="${r.id}" style="background:${floor}" title="${esc(r.name)}">${label}</div>${ph}${wh}</div>`;
    }
    html+='</div>';
  });
  world.innerHTML=html;
  if(UI.zoom==null){ const st=$('#stage').getBoundingClientRect(); const fit=Math.min(st.width*.82/Math.hypot(W,D), st.height*.8/(Math.hypot(W,D)*Math.cos(UI.tilt*Math.PI/180)+(levels.length-1)*levelGap()*Math.sin(UI.tilt*Math.PI/180)+60)); UI.zoom=Math.max(.35,Math.min(2.2,(fit||1)*1.3)); }
  applyCam();
}
function applyCam(){ const w=$('#world'); if(!w) return; const n=UI.level==='all'?3:1; const zc=(n-1)*levelGap()/2+40;
  w.style.transform=`scale(${UI.zoom}) rotateX(${UI.tilt}deg) rotateZ(${UI.spin}deg) translateZ(${-zc}px)`; }
function bindStage(){
  const st=$('#stage'); let drag=null; UI._dragged=false;
  st.addEventListener('pointerdown',e=>{ if(UI.dim==='2d'||e.target.closest('.zoom,.legend')) return; drag={x:e.clientX,y:e.clientY,spin:UI.spin,tilt:UI.tilt}; UI._dragged=false; });
  window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4){UI._dragged=true; st.classList.add('drag');}
    UI.spin=drag.spin+dx*.4; UI.tilt=Math.max(8,Math.min(84,drag.tilt-dy*.3)); applyCam(); });
  window.addEventListener('pointerup',()=>{ drag=null; st.classList.remove('drag'); });
  st.addEventListener('wheel',e=>{ if(UI.dim==='2d') return; e.preventDefault(); UI.zoom=Math.max(.3,Math.min(3,UI.zoom*Math.exp(-e.deltaY*.0012))); applyCam(); },{passive:false});

/* ----- Timeline ----- */
function renderTimeline(){
  const today=todayISO(); const prop=UI.tl.proposal;
  const ts=taskList().map(t=>prop&&prop[t.id]?{...t,start:prop[t.id].start,due:prop[t.id].due,_p:true}:t);
  const sched=ts.filter(t=>validISO(t.start)||validISO(t.due));
  const unsched=ts.filter(t=>!validISO(t.start)&&!validISO(t.due)&&t.status!=='done');
  const dates=[today]; sched.forEach(t=>{ if(validISO(t.start)) dates.push(t.start); if(validISO(t.due)) dates.push(t.due); }); if(validISO(S.meta.target)) dates.push(S.meta.target);
  dates.sort(); let from=addDays(dates[0],-7); let to=addDays(dates[dates.length-1],21); if(daysBetween(from,to)<84) to=addDays(from,84);
  const d0=toDate(from); const shift=(d0.getDay()+6)%7; from=addDays(from,-shift);
  const days=daysBetween(from,to); const px=Math.max(7,Math.min(22,Math.floor(((($('#main').clientWidth||1000)-300)/days)))); const TW=days*px;
  const xOf=s=>daysBetween(from,s)*px;
  let wk=''; for(let i=0;i<=days;i+=7){ const ds=addDays(from,i); wk+=`<div class="wk" style="left:${i*px}px">${fmtD(ds)}</div>`; }
  let grid=''; for(let i=0;i<=days;i+=7) grid+=`<div class="tl-grid" style="left:${240+i*px}px"></div>`;
  let rows='';
  for(const s of SECTORS){ const list=sched.filter(t=>t.sector===s.key).sort((a,b)=>(a.start||a.due).localeCompare(b.start||b.due)); if(!list.length) continue;
    rows+=`<div class="tl-row grp"><div class="lab"><i class="dot" style="background:${s.color}"></i>${esc(s.label)}</div><div class="tl-track" style="width:${TW}px"></div></div>`;
    for(const t of list){ const st=validISO(t.start)?t.start:addDays(t.due,-Math.max(1,Math.round(t.estDays||1))+1); const en=validISO(t.due)?t.due:addDays(st,Math.max(1,Math.round(t.estDays||1))-1);
      const L=xOf(st), Wd=Math.max(px,(daysBetween(st,en)+1)*px);
      rows+=`<div class="tl-row"><div class="lab" title="${esc(t.title)}">${esc(t.title)}${t.roomId?` <span class="muted">· ${esc(roomName(t.roomId))}</span>`:''}</div><div class="tl-track" style="width:${TW}px"><div class="tl-bar${t.status==='done'?' done':''}${t._p?' prop':''}" data-open-task="${t.id}" style="left:${L}px;width:${Wd}px;--c:${s.color}" title="${esc(t.title)}: ${fmtD(st)} – ${fmtD(en)}">${Wd>60?esc(t.title):''}</div></div></div>`; } }
  const lines=`<div class="tl-line" style="left:${240+xOf(today)}px"><span>Today</span></div>`+(validISO(S.meta.target)?`<div class="tl-line target" style="left:${240+xOf(S.meta.target)}px"><span style="color:var(--bad)">Target</span></div>`:'');
  $('#main').innerHTML=`<div class="page">
   <div class="toolbar">
     <label class="f" for="tlTarget">Target finish date<input id="tlTarget" type="date" value="${esc(S.meta.target||'')}"></label>
     <label class="f" for="tlDays">Days a week on the house<input id="tlDays" type="number" min="1" max="7" value="${S.meta.daysPerWeek||3}" style="width:90px"></label>
     ${CAP.sample?`<button class="btn primary" type="button" id="tlPlan" ${UI.tl.busy?'disabled':''} style="align-self:flex-end">${UI.tl.busy?'Planning…':'Plan my dates with AI'}</button>`:'<span class="muted" style="align-self:flex-end;font-size:12.5px">AI planning works on the published page.</span>'}
     ${prop?`<span style="align-self:flex-end;display:flex;gap:6px"><button class="btn primary" type="button" id="tlApply">Apply ${Object.keys(prop).length} dates</button><button class="btn" type="button" id="tlDiscard">Discard</button></span>`:''}
   </div>
   ${UI.tl.note?`<div class="ai-out">${esc(UI.tl.note)}</div>`:''}
   ${sched.length?`<div class="tl-wrap"><div class="tl" style="width:${240+TW}px">${grid}${lines}<div class="tl-head"><div class="lab muted">Task</div><div class="tl-track" style="width:${TW}px;height:28px">${wk}</div></div>${rows}</div></div>`:'<div class="empty">No dated tasks yet. Give tasks a start or due date, or let AI plan them against your target date.</div>'}
   ${unsched.length?`<section><h2 style="font-size:15px;margin-bottom:6px">Not scheduled yet (${unsched.length})</h2><div style="display:flex;flex-wrap:wrap;gap:6px">${unsched.map(t=>`<button type="button" class="chip" data-open-task="${t.id}" style="cursor:pointer"><i class="dot" style="background:${SEC[t.sector]?.color||'#999'}"></i>${esc(t.title)}</button>`).join('')}</div></section>`:''}
  </div>`;
}

function svgPoint(svg,e){ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function bindPlan(){
  const svg=$('#planSvg'); if(!svg) return; let mv=null;
  svg.addEventListener('pointerdown',e=>{ const g=e.target.closest('[data-pt]'); if(g&&UI.tool==='select'){ mv={id:g.dataset.pt,moved:false}; svg.setPointerCapture(e.pointerId); e.preventDefault(); } });
  svg.addEventListener('pointermove',e=>{ if(!mv) return; const p=svgPoint(svg,e); mv.moved=true; mv.x=Math.round(p.x*20)/20; mv.y=Math.round(p.y*20)/20; const g=svg.querySelector(`[data-pt="${mv.id}"]`); if(g){ g.querySelector('circle').setAttribute('cx',mv.x); g.querySelector('circle').setAttribute('cy',mv.y); const t=g.querySelector('text'); t.setAttribute('x',mv.x); t.setAttribute('y',mv.y); } });
  svg.addEventListener('pointerup',e=>{ if(!mv) return; const m=mv; mv=null;
    if(m.moved){ const room=roomAt(m.x,m.y,UI.planLevel); const p=clone(S.points[m.id]); if(room){p.x=m.x;p.y=m.y;p.roomId=room.id;} UI.planSel=m.id; savePoint(m.id,p); }
    else { UI.planSel=m.id; renderPlans(); } });
  svg.addEventListener('click',e=>{ if(UI.tool==='select'){ if(!e.target.closest('[data-pt]')&&UI.planSel){UI.planSel=null;renderPlans();} return; }
    const p=svgPoint(svg,e); const x=Math.round(p.x*20)/20, y=Math.round(p.y*20)/20; const room=roomAt(x,y,UI.planLevel);
    if(!room){ toast('Click inside a room to place the point.'); return; }
    const id=uid('p'); UI.planSel=id; savePoint(id,{type:UI.tool,roomId:room.id,x,y,label:'',done:false,created:Date.now()}); });
}
function roomAt(x,y,lv){ return roomList().find(r=>r.level===lv&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.d); }

   <h2>${id?'Edit task':'New task'}</h2>
   <label class="f" for="tfTitle">Task<input id="tfTitle" value="${esc(t.title)}" required></label>
   <div class="grid2"><label class="f" for="tfSector">Trade<select id="tfSector">${SECTORS.map(s=>`<option value="${s.key}" ${t.sector===s.key?'selected':''}>${esc(s.label)}</option>`).join('')}</select></label>
   <label class="f" for="tfRoom">Room<select id="tfRoom"><option value="">No room</option>${roomList().map(r=>`<option value="${r.id}" ${t.roomId===r.id?'selected':''}>${esc(r.name)} (${LEVELS[r.level].split(' ')[0]})</option>`).join('')}</select></label>

   <label class="f" for="tfPri">Priority<select id="tfPri">${['high','normal','low'].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></label></div>
   <div class="grid3"><label class="f" for="tfStart">Start<input id="tfStart" type="date" value="${esc(t.start||'')}"></label><label class="f" for="tfDue">Due<input id="tfDue" type="date" value="${esc(t.due||'')}"></label><label class="f" for="tfEst">Days of work<input id="tfEst" type="number" min="0" step="0.5" value="${t.estDays??''}"></label></div>
   <label class="f" for="tfNotes">Notes<textarea id="tfNotes" rows="3">${esc(t.notes||'')}</textarea></label>
   <div class="row-end">${id?`<button class="btn danger" type="button" id="tfDel">Delete</button>`:'<span></span>'}<span style="display:flex;gap:8px"><button class="btn" type="button" id="tfCancel">Cancel</button><button class="btn primary" type="submit">Save</button></span></div></form>`;
  document.body.appendChild(ov); ov.querySelector('#tfTitle').focus();

  ov.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  ov.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); const g=s=>ov.querySelector(s).value;
    const nt={...clone(t),title:g('#tfTitle').trim(),sector:g('#tfSector'),roomId:g('#tfRoom'),status:g('#tfStatus'),priority:g('#tfPri'),start:g('#tfStart'),due:g('#tfDue'),estDays:Number(g('#tfEst'))||0,notes:g('#tfNotes')};
    if(!nt.title) return; if(!id) nt.created=Date.now(); if(nt.status==='done'&&t.status!=='done') nt.doneAt=Date.now();
    ov.remove(); saveTask(id||uid('t'),nt); });
}
function lightbox(src,cap){ const ov=document.createElement('div'); ov.className='overlay lightbox'; ov.innerHTML=`<img src="${esc(src)}" alt="${esc(cap)}"><span>${esc(cap)} · click anywhere to close</span>`; ov.addEventListener('click',()=>ov.remove()); document.body.appendChild(ov); }
function toggleDone(id,on){ const t=clone(S.tasks[id]); t.status=on?'done':'todo'; if(on) t.doneAt=Date.now(); saveTask(id,t); }

/* ---------- AI ---------- */
function aiErr(e){ if(e&&e.code==='not_granted'){CAP.sample=null; return 'AI access was declined for this page.';} if(e&&e.code==='rate_limited') return 'Too many AI requests just now. Wait a minute and try again.'; return 'The AI request failed. Try again.'; }
function houseContext(){
  return `Rooms (id | name | level):\n${roomList().map(r=>`${r.id} | ${r.name} | ${LEVELS[r.level]}${r.outdoor?' (outdoor)':''}`).join('\n')}\n\nTrades (key: label): ${SECTORS.map(s=>s.key+': '+s.label).join('; ')}`;
}
async function runDump(){
  const text=($('#dumpText')?.value||'').trim(); UI.dump.text=text; if(!text){toast('Write or say something first.');return;}
  UI.dump.busy=true; renderDump();
  const existing=taskList().filter(t=>t.status!=='done').map(t=>'- '+t.title+(t.roomId?' ('+roomName(t.roomId)+')':'')).join('\n')||'(none)';
  const prompt=`You help a homeowner in Malta finish renovating an old 3-level townhouse (ground floor, first floor, roof). Turn their brain dump into concrete tasks.

${houseContext()}

Open tasks already on the list (do not duplicate these):
${existing}

Rules:
- One task = one trade in one room, small enough to finish in a few hours to a few days. Split compound sentences into separate tasks.
- Start each title with a verb. Keep titles under 70 characters. Use the homeowner's own words for things.
- sector must be one of the trade keys above. "Shaving" or "hacking off" old plaster, plastering, rendering, tiling, soffits and wall repairs are "walls". Sockets, switches, wiring, consumer unit, data and A/C are "electrical". Light fittings and lighting design are "lighting". Appliances, kitchen units and furniture are "furniture".
- roomId must be one of the room ids above, or "" if no room fits or it is house-wide.
- status: "done" if they say it is already done, "waiting" if it waits on a delivery, quote or someone else, "doing" if under way, otherwise "todo".
- priority: "high" for broken things, safety, or things blocking other trades; "low" for nice-to-haves; else "normal".
- estDays: your estimate of working days (number, can be 0.5).
- notes: optional, under 120 characters, only details from the text worth keeping (sizes, quantities, colours, who to call).

Return only JSON: {"tasks":[{"title":"","sector":"","roomId":"","status":"","priority":"","estDays":1,"notes":""}],"summary":"one short sentence on what you found"}

Brain dump:
"""${text}"""`;
  try{
    const out=await CAP.sample.json(prompt,{modelTier:'default'});
    const list=Array.isArray(out?.tasks)?out.tasks:[];
    UI.dump.rows=list.filter(t=>t&&t.title).map(t=>({inc:true,title:String(t.title).slice(0,140),sector:SEC[t.sector]?t.sector:'walls',roomId:S.rooms[t.roomId]?t.roomId:'',status:STAT[t.status]?t.status:'todo',priority:['high','normal','low'].includes(t.priority)?t.priority:'normal',estDays:Number(t.estDays)||1,notes:String(t.notes||'').slice(0,200)}));
    UI.dump.summary=String(out?.summary||'');
  }catch(e){ console.error(e); toast(aiErr(e)); }
  UI.dump.busy=false; render();
}
async function runPlan(){
  const open=taskList().filter(t=>t.status!=='done'); if(!open.length){toast('There are no open tasks to plan.');return;}
  UI.tl.busy=true; UI.tl.note=''; renderTimeline();
  const target=validISO(S.meta.target)?S.meta.target:'';
  const prompt=`Plan start and due dates for the open renovation tasks of a 3-level townhouse in Malta. The homeowner does much of the work around another job.

Today: ${todayISO()}
Target finish date: ${target||'none set, so pick a realistic finish'}
Days per week available for the house: ${S.meta.daysPerWeek||3}

Trades: ${SECTORS.map(s=>s.key+'='+s.label).join(', ')}

Open tasks (id | title | trade | room | status | priority | estimated working days | current start..due):
${open.map(t=>`${t.id} | ${t.title} | ${t.sector} | ${roomName(t.roomId)||'-'} | ${t.status} | ${t.priority} | ${t.estDays||1} | ${t.start||'-'}..${t.due||'-'}`).join('\n')}

Wall works logged per room (surface: stages still needed):
${roomList().map(r=>{const w=r.walls||{};const need=WALLS.map(k=>{const st=w[k.key]||{};const n=STAGES.filter(s=>st[s.key]==='need').map(s=>s.short);return n.length?k.label+': '+n.join('>'):''}).filter(Boolean);return need.length?r.name+' — '+need.join('; '):''}).filter(Boolean).join('\n')||'(none logged)'}

Sequencing rules for each room: shave off old plaster first; then first-fix electrical and plumbing (chasing, conduits, pipes); then plaster and render; then tiling; then second-fix (sockets, switches, sanitaryware); then painting; then light fittings, furniture and kitchen. Fix broken or high-priority things early. Tasks with status "waiting" depend on someone else: give them a short window soon. Spread work so that only about ${S.meta.daysPerWeek||3} working days per week are used in total, and keep the last task on or before the target date if there is one; if it cannot fit, say so in the note.

Return only JSON: {"schedule":[{"id":"","start":"YYYY-MM-DD","due":"YYYY-MM-DD"}],"note":"two or three short sentences on the plan and any risk to the target date"}`;
  try{
    const out=await CAP.sample.json(prompt,{modelTier:'complex'});
    const prop={}; for(const s of (out?.schedule||[])){ if(S.tasks[s.id]&&validISO(s.start)&&validISO(s.due)){ prop[s.id]=s.start<=s.due?{start:s.start,due:s.due}:{start:s.due,due:s.start}; } }
    UI.tl.proposal=Object.keys(prop).length?prop:null; UI.tl.note=String(out?.note||'')+(Object.keys(prop).length?' Dashed bars are proposed dates. Apply them or discard.':'');
  }catch(e){ console.error(e); toast(aiErr(e)); }
  UI.tl.busy=false; render();
}
async function runAdvice(){
  UI.advice.busy=true; UI.advice.text=''; renderRail();
  const bs=bySector(); const ts=taskList();
  const prompt=`You are a practical site foreman helping a homeowner finish an old 3-level townhouse in Malta that has dragged on for 3 years. Suggest what to do next.

Progress by trade: ${SECTORS.map(s=>`${s.label} ${bs[s.key].done}/${bs[s.key].total}`).join('; ')}
Open tasks: ${ts.filter(t=>t.status!=='done').map(t=>`${t.title} [${SEC[t.sector]?.label}${t.roomId?', '+roomName(t.roomId):''}${t.priority==='high'?', high':''}${t.status==='waiting'?', waiting':''}${t.due?', due '+t.due:''}]`).join('; ')||'none'}
Recently done: ${ts.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,8).map(t=>t.title).join('; ')||'none'}
Target date: ${S.meta.target||'not set'}; today ${todayISO()}.

Give exactly three numbered next actions, one line each, most useful first, in trade-sequence order (strip, first fix, plaster, second fix, paint, fit-out). Favour finishing one room completely to build momentum. If the list is thin, the last action should be to log what a specific room still needs. Plain text, no preamble.`;
  try{ await CAP.sample(prompt,{modelTier:'quick',onText:({text})=>{UI.advice.text=text; const o=$('#adviceOut'); if(o) o.textContent=text;}}); }
  catch(e){ UI.advice.text=aiErr(e); }
  UI.advice.busy=false; renderRail();
}

document.addEventListener('click',e=>{

  const ly=t.closest('[data-layer]'); if(ly){ UI.layer=ly.dataset.layer; renderHouse(); return; }
  if(t.closest('#wallLow')){ UI.full=false; renderHouse(); return; }
  if(t.closest('#wallFull')){ UI.full=true; renderHouse(); return; }
  if(t.closest('#dim3')){ UI.dim='3d'; UI.zoom=null; renderHouse(); return; }
  if(t.closest('#dim2')){ UI.dim='2d'; renderHouse(); return; }
  if(t.closest('#railBack')){ if(UI.editRoom&&UI.editRoom!=='new'){UI.editRoom=null;} else {UI.editRoom=null; UI.room=null;} renderHouse(); return; }

  if(t.closest('#adviceBtn')){ runAdvice(); return; }
  const rt=t.closest('[data-rtab]'); if(rt){ UI.roomTab=rt.dataset.rtab; UI.confirmDel=null; renderRail(); return; }
  const wc=t.closest('[data-wall]'); if(wc){ const r=clone(S.rooms[UI.room]); r.walls=r.walls||{}; const w=r.walls[wc.dataset.wall]=r.walls[wc.dataset.wall]||{}; const cur=w[wc.dataset.stage]||''; const nx=cur===''?'need':cur==='need'?'done':''; if(nx) w[wc.dataset.stage]=nx; else delete w[wc.dataset.stage]; saveRoom(UI.room,r); return; }
  const aw=t.closest('[data-allwalls]'); if(aw){ const r=clone(S.rooms[UI.room]); r.walls=r.walls||{}; for(const k of ['front','right','back','left']){ const w=r.walls[k]=r.walls[k]||{}; if(!w[aw.dataset.allwalls]) w[aw.dataset.allwalls]='need'; } saveRoom(UI.room,r); return; }
  const gp=t.closest('[data-goplan]'); if(gp){ UI.planLevel=Number(gp.dataset.goplan); go('plans'); return; }
  const li=t.closest('[data-lightbox]'); if(li){ const r=S.rooms[UI.room]; const im=r.images[Number(li.dataset.lightbox)]; lightbox(im.url||('/_blob/'+im.id),r.name); return; }
  const ri=t.closest('[data-rmimg]'); if(ri){ const r=clone(S.rooms[UI.room]); r.images.splice(Number(ri.dataset.rmimg),1); saveRoom(UI.room,r); return; }
  if(t.closest('#rfDel')){ const id=UI.room||UI.editRoom; if(UI.confirmDel===id){ store.del('rooms',id); taskList().filter(x=>x.roomId===id).forEach(x=>{const n=clone(S.tasks[x.id]); n.roomId=''; saveTask(x.id,n);}); pointList().filter(p=>p.roomId===id).forEach(p=>store.del('points',p.id)); itemList().filter(x=>x.roomId===id).forEach(x=>{const n=clone(S.items[x.id]); n.roomId=''; store.put('items',x.id,n);}); UI.room=null; UI.editRoom=null; UI.confirmDel=null; renderHouse(); } else { UI.confirmDel=id; renderRail(); } return; }
  // tasks board
  const ts=t.closest('[data-tsec]'); if(ts){ const k=ts.dataset.tsec; UI.tf.sectors=UI.tf.sectors.includes(k)?UI.tf.sectors.filter(x=>x!==k):[...UI.tf.sectors,k]; renderTasks(); return; }
  const cd=t.closest('[data-card]'); if(cd){ openTask(cd.dataset.card); return; }
  if(t.closest('#showDone')){ UI.showAllDone=true; renderTasks(); return; }

  if(t.closest('#tlApply')){ const p=UI.tl.proposal; UI.tl.proposal=null; UI.tl.note='Dates applied.'; for(const [id,d] of Object.entries(p)){ const n=clone(S.tasks[id]); if(!n) continue; n.start=d.start; n.due=d.due; saveTask(id,n); } return; }
  if(t.closest('#tlDiscard')){ UI.tl.proposal=null; UI.tl.note=''; renderTimeline(); return; }

    UI.dump={text:'',rows:null,busy:false,summary:''}; toast(`Added ${add.length} tasks.`); renderDump(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(handleExtraChange(t)) return;
  if(t.dataset.done){ toggleDone(t.dataset.done,t.checked); return; }
  if(t.dataset.ptdone){ const p=clone(S.points[t.dataset.ptdone]); p.done=t.checked; savePoint(t.dataset.ptdone,p); return; }
  if(t.id==='metaName'){ saveMeta({name:t.value.trim()||'My house'}); return; }
  if(t.id==='roomNotes'){ const r=clone(S.rooms[UI.room]); r.notes=t.value; saveRoom(UI.room,r); return; }
  if(t.id==='troom'){ UI.tf.room=t.value; renderTasks(); return; }
  if(t.id==='tlTarget'){ saveMeta({target:t.value}); return; }
  if(t.id==='tlDays'){ saveMeta({daysPerWeek:Math.max(1,Math.min(7,Number(t.value)||3))}); return; }

  if(t.id==='ptLabel'){ const p=clone(S.points[UI.planSel]); p.label=t.value; savePoint(UI.planSel,p); return; }
  if(t.id==='ptDone'){ const p=clone(S.points[UI.planSel]); p.done=t.checked; savePoint(UI.planSel,p); return; }
  if(t.dataset.pr!=null){ const r=UI.dump.rows[Number(t.dataset.pr)]; const f=t.dataset.f; r[f]=f==='inc'?t.checked:t.value; if(f==='inc'){ const b=$('#dumpAdd'); if(b) b.textContent=`Add ${UI.dump.rows.filter(x=>x.inc).length} tasks`; } return; }

function wallSeg(r,k){ switch(k){ case 'front':return{p:[r.x,r.y],d:[1,0],n:[0,1],L:r.w}; case 'back':return{p:[r.x,r.y+r.d],d:[1,0],n:[0,-1],L:r.w}; case 'left':return{p:[r.x,r.y],d:[0,1],n:[1,0],L:r.d}; case 'right':return{p:[r.x+r.w,r.y],d:[0,1],n:[-1,0],L:r.d}; } return null; }
function openingGeom(r,o){
  const s=wallSeg(r,o.wall); if(!s||s.L<=0) return null;
  const off=Math.max(0,Math.min(s.L-.1,+o.offset||0)); const w=Math.max(.1,Math.min(s.L-off,+o.width||.8));
  const p0=[s.p[0]+s.d[0]*off,s.p[1]+s.d[1]*off], p1=[p0[0]+s.d[0]*w,p0[1]+s.d[1]*w];
  const hinge=o.hinge==='end'?p1:p0, other=o.hinge==='end'?p0:p1; const leaf=[hinge[0]+s.n[0]*w,hinge[1]+s.n[1]*w];
  const a1=Math.atan2(leaf[1]-hinge[1],leaf[0]-hinge[0]); let a2=Math.atan2(other[1]-hinge[1],other[0]-hinge[0]); let da=a2-a1; while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
  const arc=[]; for(let i=0;i<=12;i++){ const a=a1+da*i/12; arc.push([hinge[0]+Math.cos(a)*w,hinge[1]+Math.sin(a)*w]); }
  return {p0,p1,hinge,leaf,arc,n:s.n,d:s.d,w};
}
const WALL_SEGS=r=>({front:[r.x,r.y,r.x+r.w,r.y],right:[r.x+r.w,r.y,r.x+r.w,r.y+r.d],back:[r.x,r.y+r.d,r.x+r.w,r.y+r.d],left:[r.x,r.y,r.x,r.y+r.d]});
function insetSeg(k,s,i){ let [x1,y1,x2,y2]=s; if(k==='front'){y1+=i;y2+=i;} if(k==='back'){y1-=i;y2-=i;} if(k==='left'){x1+=i;x2+=i;} if(k==='right'){x1-=i;x2-=i;} return [x1,y1,x2,y2]; }
function planG(lv,o={}){
  const rs=roomList().filter(r=>r.level===lv); const b=houseBounds(); let g='';
  const fw=+S.meta.width||0, fd=+S.meta.depth||0;

  for(const r of rs){ let fill=r.outdoor?'var(--floor-out)':'var(--floor)'; if(o.fill==='progress'){ const p=progress(items({room:r.id})).pct; if(p!=null) fill=pctColor(p,.85); }
    const click=o.click?` data-${o.click}="${r.id}"`:''; const sel=o.sel===r.id?' stroke="var(--accent)" stroke-width=".1"':' stroke="none"';
    g+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.d}" fill="${fill}"${sel}${click}><title>${esc(r.name)}</title></rect>`; }
  for(const r of rs){ for(const [k,s] of Object.entries(WALL_SEGS(r))){ const ws=o.walls?wallState((r.walls||{})[k]):null; const [x1,y1,x2,y2]=insetSeg(k,s,.06);
      g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ws?ws.color:'var(--wall-top)'}" stroke-width="${ws?.12:.07}" stroke-linecap="square" pointer-events="none"/>`; } }
  for(const r of rs){ for(const op of (r.openings||[])){ const q=openingGeom(r,op); if(!q) continue; const nx=q.n[0]*.17, ny=q.n[1]*.17;
      g+=`<line x1="${q.p0[0]}" y1="${q.p0[1]}" x2="${q.p1[0]}" y2="${q.p1[1]}" stroke="var(--panel)" stroke-width=".34" pointer-events="none"/>`;
      if(op.type==='door'){ g+=`<line x1="${q.hinge[0]}" y1="${q.hinge[1]}" x2="${q.leaf[0]}" y2="${q.leaf[1]}" stroke="var(--ink)" stroke-width=".035" pointer-events="none"/><polyline points="${q.arc.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width=".02" stroke-dasharray=".06 .04" pointer-events="none"/>`; }
      else if(op.type==='window'){ for(const f of [-.07,0,.07]) g+=`<line x1="${q.p0[0]+q.n[0]*f}" y1="${q.p0[1]+q.n[1]*f}" x2="${q.p1[0]+q.n[0]*f}" y2="${q.p1[1]+q.n[1]*f}" stroke="var(--accent)" stroke-width=".025" pointer-events="none"/>`; }
      for(const p of [q.p0,q.p1]) g+=`<line x1="${p[0]-nx}" y1="${p[1]-ny}" x2="${p[0]+nx}" y2="${p[1]+ny}" stroke="var(--wall-top)" stroke-width=".05" pointer-events="none"/>`; } }
  if(o.labels!==false) for(const r of rs){ const fs=Math.max(.1,Math.min(.34,r.d/3,r.w*.9/(Math.max(4,r.name.length)*.55))); const p=o.fill==='progress'?progress(items({room:r.id})).pct:null;
    g+=`<text x="${r.x+r.w/2}" y="${r.y+r.d/2}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="600" font-size="${fs}" fill="var(--ink)" pointer-events="none">${esc(r.name)}</text>`;
    g+=`<text x="${r.x+r.w/2}" y="${r.y+r.d/2+fs*1.15}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="${fs*.62}" fill="var(--muted)" pointer-events="none">${p!=null?p+'% · ':''}${(+r.w).toFixed(2)} × ${(+r.d).toFixed(2)}</text>`; }
  if(o.dims){ const W=b.x1-b.x0, D=b.y1-b.y0;
    g+=`<g stroke="var(--muted)" stroke-width="0.02" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="0.26" pointer-events="none">
     <line x1="${b.x0}" y1="${b.y0-.7}" x2="${b.x1}" y2="${b.y0-.7}"/><line x1="${b.x0}" y1="${b.y0-.85}" x2="${b.x0}" y2="${b.y0-.55}"/><line x1="${b.x1}" y1="${b.y0-.85}" x2="${b.x1}" y2="${b.y0-.55}"/>
     <text x="${b.x0+W/2}" y="${b.y0-.82}" text-anchor="middle" stroke="none">${W.toFixed(2)} m · street</text>
     <line x1="${b.x0-.7}" y1="${b.y0}" x2="${b.x0-.7}" y2="${b.y1}"/><line x1="${b.x0-.85}" y1="${b.y0}" x2="${b.x0-.55}" y2="${b.y0}"/><line x1="${b.x0-.85}" y1="${b.y1}" x2="${b.x0-.55}" y2="${b.y1}"/>
     <text x="${b.x0-.82}" y="${b.y0+D/2}" text-anchor="middle" stroke="none" transform="rotate(-90 ${b.x0-.82} ${b.y0+D/2})">${D.toFixed(2)} m</text></g>`; }
  if(o.pts&&o.pts.length){ for(const p of pointList()){ const ty=PT[p.type]; const r=S.rooms[p.roomId]; if(!ty||!r||r.level!==lv||!o.pts.includes(ty.sector)) continue; const c=SEC[ty.sector].color; const sel=o.ptsel===p.id;
    g+=`<g data-pt="${p.id}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="${sel?.26:.2}" fill="${p.done?c:'var(--panel)'}" stroke="${sel?'var(--accent)':c}" stroke-width="${sel?.07:.05}"/><text x="${p.x}" y="${p.y+.004}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="${ty.g.length>1?.13:.17}" fill="${p.done?'#fff':c}" pointer-events="none">${ty.g}</text><title>${esc(p.label||ty.label)}${p.done?' (done)':''}</title></g>`; } }
  return g;
}

function parseCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); if(!lines.length) return {rows:[],errors:['The CSV is empty.']};
  const split=l=>{ const out=[]; let cur='',q=false; for(const ch of l){ if(ch==='"'){q=!q;continue;} if((ch===','||ch===';'||ch==='\t')&&!q){out.push(cur.trim());cur='';continue;} cur+=ch; } out.push(cur.trim()); return out; };
  let start=0; if(/name/i.test(lines[0])) start=1;
  const rows=[],errors=[];
  for(let i=start;i<lines.length;i++){ const c=split(lines[i]); if(c.length<6){ errors.push(`Line ${i+1}: needs at least 6 columns.`); continue; }
    const lvRaw=c[0].toLowerCase(); const level=/^(0|g|gr|ground)/.test(lvRaw)?0:/^(1|f|first)/.test(lvRaw)?1:/^(2|r|roof)/.test(lvRaw)?2:null;
    const nums=c.slice(2,6).map(v=>Number(String(v).replace(',','.')));
    if(level==null){ errors.push(`Line ${i+1}: level "${c[0]}" should be G, F or R.`); continue; }
    if(!c[1]){ errors.push(`Line ${i+1}: room name is missing.`); continue; }
    if(nums.some(n=>isNaN(n))||nums[2]<=0||nums[3]<=0){ errors.push(`Line ${i+1}: position and size must be numbers in metres.`); continue; }
    rows.push({level,name:c[1],x:nums[0],y:nums[1],w:nums[2],d:nums[3],outdoor:/^(y|yes|true|1|out)/i.test(c[6]||'')}); }
  return {rows,errors};
}
function roomsCSV(){ return 'level,name,from_left,from_front,width,depth,outdoor\n'+roomList().map(r=>[['G','F','R'][r.level],/[,"]/.test(r.name)?'"'+r.name.replace(/"/g,'')+'"':r.name,r.x,r.y,r.w,r.d,r.outdoor?'yes':'no'].join(',')).join('\n'); }
function importCSV(){
  const {rows,errors}=parseCSV(UI.csv.text);
  if(!rows.length){ UI.csv.msg=errors.join(' ')||'Nothing to import.'; UI.csv.err=true; renderSetup(); return; }
  const existing=roomList(); const key=(l,n)=>l+'|'+n.trim().toLowerCase(); const map=Object.fromEntries(existing.map(r=>[key(r.level,r.name),r]));
  let up=0,add=0,del=0; const seen=new Set();
  for(const r of rows){ const k=key(r.level,r.name); seen.add(k); const ex=map[k];
    if(ex){ moveRoom(ex.id,{x:r.x,y:r.y,w:r.w,d:r.d,outdoor:r.outdoor,name:r.name}); up++; }
    else { saveRoom(uid('r'),{name:r.name,level:r.level,x:r.x,y:r.y,w:r.w,d:r.d,outdoor:r.outdoor,notes:'',walls:{},images:[],openings:[]}); add++; } }
  if(UI.csv.prune){ for(const r of existing){ if(!seen.has(key(r.level,r.name))){ deleteRoom(r.id); del++; } } }
  UI.csv.msg=`Imported: ${up} updated, ${add} added${UI.csv.prune?`, ${del} removed`:''}.${errors.length?' Skipped: '+errors.join(' '):''}`; UI.csv.err=!!errors.length;
}
function backupJSON(){ return JSON.stringify({app:'house-hub',version:1,exported:new Date().toISOString(),meta:S.meta,rooms:S.rooms,tasks:S.tasks,points:S.points,items:S.items},null,2); }
function restoreBackup(d){
  for(const col of ['rooms','tasks','points','items']){ const keep=d[col]||{}; for(const id of Object.keys(S[col])) if(!keep[id]) store.del(col,id); for(const [id,v] of Object.entries(keep)) store.put(col,id,v); }
  if(d.meta) store.put('meta','house',{...d.meta});
}
function deleteRoom(id){ store.del('rooms',id); taskList().filter(x=>x.roomId===id).forEach(x=>{const n=clone(S.tasks[x.id]); n.roomId=''; saveTask(x.id,n);}); pointList().filter(p=>p.roomId===id).forEach(p=>store.del('points',p.id)); itemList().filter(x=>x.roomId===id).forEach(x=>{const n=clone(S.items[x.id]); n.roomId=''; store.put('items',x.id,n);}); }

function unitPrice(it){ const qs=(it.quotes||[]).filter(q=>q.price!==''&&q.price!=null&&!isNaN(+q.price)); const ch=qs.find(q=>q.id===it.chosen); if(ch) return +ch.price; if(qs.length) return Math.min(...qs.map(q=>+q.price)); return it.estimate!==''&&it.estimate!=null&&!isNaN(+it.estimate)?+it.estimate:null; }
function lineTotal(it){ const u=unitPrice(it); return u==null?null:u*(+it.qty||1); }
